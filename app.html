/* Story mode refinement: one active gap at a time, less visual overload */
.story-screen{
  overflow:auto;
  align-items:flex-start;
  padding-top:86px;
}

.story-center{
  max-width:1180px;
  padding-bottom:42px;
}

.story-title{
  margin-bottom:10px;
}

.story-progress{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:64px;
  padding:7px 14px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:999px;
  color:#c7eaff;
  font-family:Arial,sans-serif;
  font-size:14px;
  margin-bottom:22px;
  background:rgba(255,255,255,.045);
}

.story-text{
  max-width:1040px;
  margin:0 auto;
  font-size:clamp(25px,3.05vw,44px);
  line-height:1.42;
}

.story-gap{
  display:inline-block;
  min-width:130px;
  border-bottom:3px solid #ff5fd7;
  color:#65e8ff;
  padding:0 8px;
  text-align:center;
}

.story-gap-active{
  border-bottom-color:#65e8ff;
  box-shadow:0 11px 0 -8px rgba(255,95,215,.85);
  animation:softPulse 1.65s ease-in-out infinite;
}

.story-active-card{
  width:min(720px,100%);
  margin:30px auto 0;
  padding:22px 22px 24px;
  border:1px solid rgba(255,255,255,.11);
  border-radius:28px;
  background:rgba(255,255,255,.038);
  backdrop-filter:blur(10px);
}

.story-prompt{
  color:#9daac7;
  font-family:Arial,sans-serif;
  font-size:14px;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:16px;
}

.story-option-block{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}

.story-choice-wrong{
  border-color:rgba(255,95,120,.85);
  background:rgba(255,95,120,.15);
  animation:softShake .35s ease;
}

@keyframes softPulse{
  0%,100%{filter:drop-shadow(0 0 0 rgba(101,232,255,0));}
  50%{filter:drop-shadow(0 0 15px rgba(101,232,255,.35));}
}

@keyframes softShake{
  0%,100%{transform:translateX(0)}
  35%{transform:translateX(-5px)}
  70%{transform:translateX(5px)}
}

@media(max-width:760px){
  .story-screen{padding-top:82px;}
  .story-text{font-size:clamp(23px,7vw,34px);line-height:1.38;}
  .story-gap{min-width:92px;}
  .story-choice{font-size:17px;padding:11px 17px;}
}

/* Words mode refinement: word and translation crumble separately, never merge into one combined word */
.word-pair-dissolve-wrap{
  position:relative;
  width:100%;
  min-height:360px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.word-pair-dissolve{
  position:relative;
  z-index:5;
  min-height:360px;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:28px;
  pointer-events:none;
}

.word-crumble-line{
  display:block;
  text-align:center;
  white-space:nowrap;
}

.word-crumble-main{
  font-size:clamp(76px,12vw,154px);
  font-style:italic;
  line-height:1.05;
}

.word-crumble-translation{
  font-family:Arial,sans-serif;
  font-size:clamp(28px,4vw,52px);
  letter-spacing:.02em;
}

.word-crumble-letter{
  display:inline-block;
  color:white;
  text-shadow:0 0 18px rgba(255,255,255,.18);
  transform-origin:center bottom;
  will-change:transform,opacity,filter;
}

.word-pair-dissolve.is-crumbling .word-crumble-letter{
  animation:wordCrumbleApart var(--duration) cubic-bezier(.18,.75,.28,1) forwards;
  animation-delay:var(--delay);
  color:var(--color);
  text-shadow:0 0 18px var(--color);
}

@keyframes wordCrumbleApart{
  0%{
    transform:translate3d(0,0,0) scale(1) rotate(0deg);
    opacity:1;
    filter:blur(0);
  }
  38%{
    opacity:.82;
    filter:blur(.4px);
  }
  100%{
    transform:translate3d(var(--x),var(--y),0) scale(.38) rotate(var(--r));
    opacity:0;
    filter:blur(4px);
  }
}

@media(max-width:760px){
  .word-pair-dissolve,.word-pair-dissolve-wrap{min-height:300px;}
  .word-crumble-main{font-size:clamp(58px,16vw,112px);}
}

/* Memory mode: real matching-card game with growing boards */
.memory-screen{
  overflow:auto;
  align-items:flex-start;
  padding-top:86px;
}

.memory-center{
  max-width:1240px;
  padding-bottom:52px;
}

.memory-title{
  margin:0;
  font-size:clamp(38px,5.4vw,72px);
  font-style:italic;
  font-weight:400;
}

.memory-subtitle{
  max-width:760px;
  margin:14px auto 0;
  color:#9daac7;
  font-family:Arial,sans-serif;
  font-size:18px;
  line-height:1.6;
}

.memory-stats{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:24px auto 24px;
  font-family:Arial,sans-serif;
}

.memory-stats span{
  border:1px solid rgba(255,255,255,.12);
  border-radius:999px;
  background:rgba(255,255,255,.045);
  color:#c7eaff;
  padding:8px 14px;
  font-size:14px;
}

.memory-board{
  width:min(1020px,100%);
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(118px,1fr));
  gap:12px;
}

.memory-board-large{
  width:min(1180px,100%);
  grid-template-columns:repeat(auto-fit,minmax(92px,1fr));
  gap:9px;
}

.memory-card{
  border:0;
  padding:0;
  min-height:106px;
  border-radius:22px;
  background:transparent;
  perspective:900px;
}

.memory-board-large .memory-card{
  min-height:82px;
  border-radius:18px;
}

.memory-card:disabled{
  cursor:default;
}

.memory-card-inner{
  position:relative;
  display:block;
  width:100%;
  height:100%;
  min-height:inherit;
  border-radius:inherit;
  transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.18,.75,.28,1), filter .3s ease;
}

.memory-card.is-open .memory-card-inner,
.memory-card.is-matched .memory-card-inner{
  transform:rotateY(180deg);
}

.memory-card-back,
.memory-card-front{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
  border-radius:inherit;
  backface-visibility:hidden;
  border:1px solid rgba(255,255,255,.12);
  overflow:hidden;
}

.memory-card-back{
  background:linear-gradient(135deg,rgba(255,95,215,.18),rgba(101,232,255,.12));
  color:#f5f8ff;
  font-size:17px;
  font-style:italic;
  letter-spacing:.04em;
  text-shadow:0 0 16px rgba(255,255,255,.22);
}

.memory-card-front{
  transform:rotateY(180deg);
  background:rgba(255,255,255,.07);
  color:white;
  font-size:clamp(16px,1.8vw,24px);
  font-style:italic;
  line-height:1.1;
  text-align:center;
  word-break:break-word;
}

.memory-board-large .memory-card-front{
  font-size:clamp(12px,1.25vw,18px);
  padding:7px;
}

.memory-card-word{
  color:#fce8ff;
  text-shadow:0 0 14px rgba(255,95,215,.28);
}

.memory-card-translation{
  color:#dcfbff;
  font-family:Arial,sans-serif;
  font-style:normal;
}

.memory-card.is-matched .memory-card-inner{
  filter:drop-shadow(0 0 16px rgba(101,232,255,.28));
}

.memory-card.is-matched .memory-card-front{
  border-color:rgba(101,232,255,.55);
  background:rgba(101,232,255,.10);
}

.memory-card.is-wrong .memory-card-inner{
  animation:memoryShake .36s ease;
}

@keyframes memoryShake{
  0%,100%{transform:rotateY(180deg) translateX(0)}
  30%{transform:rotateY(180deg) translateX(-5px)}
  70%{transform:rotateY(180deg) translateX(5px)}
}

.memory-complete-card{
  width:min(520px,100%);
  margin:28px auto 0;
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;
  background:rgba(255,255,255,.045);
  padding:20px 22px 26px;
}

.memory-complete-card p{
  margin:0;
  color:#c7eaff;
  font-size:26px;
  font-style:italic;
}

.memory-soft-button{
  margin-top:22px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:999px;
  background:rgba(255,255,255,.04);
  color:#c7eaff;
  padding:10px 18px;
  font-family:Arial,sans-serif;
  font-size:14px;
}

.memory-soft-button:hover{
  background:rgba(255,255,255,.10);
}

@media(max-width:760px){
  .memory-screen{padding-top:82px;}
  .memory-board{grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:9px;}
  .memory-board-large{grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:7px;}
  .memory-card{min-height:82px;border-radius:17px;}
  .memory-board-large .memory-card{min-height:64px;border-radius:14px;}
  .memory-card-back{font-size:13px;}
  .memory-card-front{font-size:clamp(12px,4vw,17px);padding:7px;}
}

/* Story clue refinement: the blank now shows a small mother-language hint */
.story-gap{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  vertical-align:baseline;
  min-width:140px;
  min-height:46px;
  padding:0 14px 4px;
  border-bottom:3px solid #ff5fd7;
  color:#65e8ff;
  text-align:center;
}

.story-gap-clue{
  display:inline-block;
  max-width:160px;
  color:rgba(214,229,255,.74);
  font-family:Arial,sans-serif;
  font-size:clamp(13px,1.6vw,20px);
  font-style:normal;
  line-height:1;
  letter-spacing:.02em;
  transform:translateY(2px);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.story-gap-active .story-gap-clue{
  color:#dffaff;
  text-shadow:0 0 12px rgba(101,232,255,.35);
}

@media(max-width:760px){
  .story-gap{min-width:96px;min-height:38px;padding-inline:8px;}
  .story-gap-clue{max-width:105px;font-size:12px;}
}

/* Fill Gap uses the same loved clue style as Story Mode. Only the language logic was repaired. */
.fill-gap-sentence{
  gap:.18em;
  flex-wrap:wrap;
}

.fill-gap-blank{
  margin:0 .12em;
}

.toggle:disabled{
  opacity:.42;
  cursor:not-allowed;
  transform:none;
}

/* Words speech-practice mode: soft prompt and positive feedback, no pressure */
.speech-practice-card{
  margin-top:10px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.045);
  border-radius:24px;
  padding:14px 22px;
  max-width:min(620px,92vw);
  font-family:Arial,sans-serif;
  color:#c7eaff;
  font-size:clamp(16px,2.2vw,22px);
  line-height:1.45;
  box-shadow:0 0 28px rgba(101,232,255,.08);
}

.speech-practice-card.listening{
  border-color:rgba(101,232,255,.55);
  background:rgba(101,232,255,.08);
}

.speech-practice-card.feedback{
  border-color:rgba(159,255,228,.5);
  background:rgba(159,255,228,.07);
}

.speech-practice-card small{
  display:block;
  margin-top:8px;
  color:#9daac7;
  font-size:14px;
}

.speech-practice-card.retrying{
  border-color:rgba(255,221,145,.5);
  background:rgba(255,221,145,.07);
}

.speech-practice-card.no-audio{
  border-color:rgba(255,255,255,.18);
  background:rgba(255,255,255,.055);
  color:#d9e2ff;
}

/* Speech monitor: shows whether the browser is actually listening */
.speech-debug-panel{
  width:min(760px,92vw);
  margin:24px auto 0;
  padding:16px 18px;
  border:1px solid rgba(101,232,255,.22);
  border-radius:22px;
  background:rgba(0,0,0,.34);
  font-family:Arial,sans-serif;
  color:#c9d7f3;
  text-align:left;
  backdrop-filter:blur(10px);
}

.speech-debug-title{
  color:#d8f8ff;
  font-size:14px;
  letter-spacing:.1em;
  text-transform:uppercase;
  margin-bottom:12px;
}

.speech-debug-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px 14px;
  font-size:13px;
  line-height:1.35;
}

.speech-debug-grid span{
  overflow-wrap:anywhere;
}

.speech-debug-events{
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid rgba(255,255,255,.1);
  font-size:12px;
  line-height:1.5;
  color:#9daac7;
  max-height:96px;
  overflow:auto;
}

.top-actions button:disabled{
  opacity:.52;
  cursor:not-allowed;
}

@media(max-width:760px){
  .speech-debug-grid{grid-template-columns:1fr;}
  .speech-debug-panel{margin-top:18px;}
}


.story-category-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}

.story-category-card {
  min-height: 92px;
  text-align: left;
}

.story-subtitle {
  margin-top: -4px;
  margin-bottom: 12px;
  opacity: 0.68;
  font-style: italic;
}

.coming-soon-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 24px 0;
  padding: 18px;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 18px;
  background: rgba(255,255,255,0.04);
}

.coming-soon-card span {
  opacity: 0.72;
  line-height: 1.45;
}

.translation-reading {
  width: min(860px, 92vw);
  text-align: center;
}

.translation-reading-label {
  margin-bottom: 18px;
  font-size: 0.82rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.64;
}

.translation-reading-text {
  font-size: clamp(1.2rem, 2.5vw, 2rem);
  line-height: 1.65;
  white-space: pre-wrap;
}

.translation-stop-button {
  margin-top: 26px;
}

/* Full mother-tongue reading: the visual effect now unfolds during narration */
.translation-experience-screen{overflow:auto;align-items:flex-start;padding-top:88px}
.translation-experience-center{max-width:1180px;padding-bottom:48px}
.translation-reading-live{position:relative;isolation:isolate;width:min(1080px,100%);margin:0 auto;padding:42px 34px 34px;border:1px solid rgba(255,255,255,.10);border-radius:34px;background:rgba(255,255,255,.025);overflow:hidden;backdrop-filter:blur(12px)}
.translation-aurora{position:absolute;z-index:-1;inset:-35%;background:conic-gradient(from 180deg,rgba(255,95,215,.18),rgba(101,232,255,.15),rgba(179,155,255,.18),rgba(255,95,215,.18));filter:blur(72px);animation:translationAurora 13s linear infinite;opacity:.8}
.translation-reading-label{font-family:Arial,sans-serif;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#9daac7;margin-bottom:24px}
.translation-word-flow{font-size:clamp(30px,4.2vw,58px);line-height:1.42;font-style:italic;font-weight:400;text-wrap:balance;min-height:300px;display:block;text-align:center}
.translation-flow-word{display:inline-block;color:rgba(255,255,255,.27);filter:blur(.25px);transform:translateY(2px);transition:color .7s ease,text-shadow .7s ease,transform .7s ease,filter .7s ease}
.translation-flow-word.is-read{color:rgba(255,255,255,.92);filter:blur(0);transform:translateY(0);text-shadow:0 0 18px rgba(101,232,255,.12)}
.translation-flow-word.is-current{color:#fff;text-shadow:0 0 11px rgba(255,95,215,.75),0 0 30px rgba(101,232,255,.48);transform:translateY(-2px) scale(1.025)}
.translation-reading-hint{margin-top:22px;color:#9daac7;font-family:Arial,sans-serif;font-size:14px;font-style:italic}
.translation-stop-button{margin-top:22px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.055);color:white;border-radius:999px;padding:11px 19px;font-family:Arial,sans-serif;font-size:14px;transition:.25s ease}
.translation-stop-button:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
@keyframes translationAurora{to{transform:rotate(360deg)}}
@media(max-width:760px){.translation-experience-screen{padding-top:80px}.translation-reading-live{padding:32px 20px 28px;border-radius:26px}.translation-word-flow{font-size:clamp(27px,7.2vw,40px);line-height:1.38;min-height:280px}}

.story-choice:disabled{
  cursor:default;
  opacity:.46;
  transform:none;
}

.story-language-card {
  width: min(680px, 92vw);
  padding: 28px;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 22px;
  background: rgba(255,255,255,.06);
  text-align: center;
}
.story-language-card progress { width: 100%; height: 12px; }
.story-language-card .primary-button { margin-top: 18px; }
.story-translation-note { opacity: .72; font-size: .92rem; margin-top: 18px; }
.story-translation-error { color: #ffb2b2; margin-top: 16px; }

/* v2.16: several gaps per story block and a guaranteed continuation path */
.story-progress-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:22px;
}
.story-progress-row .story-progress{margin-bottom:0}
.story-word-progress{color:#f0c7ff}
.story-gap-future{
  opacity:.56;
  border-bottom-color:rgba(255,95,215,.55);
  animation:none;
}
.story-gap-future .story-gap-clue{color:rgba(214,229,255,.42)}
.story-completion-button{
  border:1px solid rgba(101,232,255,.52);
  background:rgba(101,232,255,.11);
  color:white;
  border-radius:999px;
  padding:12px 22px;
  font-family:Arial,sans-serif;
  font-size:15px;
  transition:.22s ease;
}
.story-completion-button:hover{
  transform:translateY(-1px);
  background:rgba(101,232,255,.18);
}
.translation-action-row{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:22px;
}
.translation-action-row .translation-stop-button{margin-top:0}
.translation-continue-button{
  border-color:rgba(101,232,255,.52);
  background:rgba(101,232,255,.11);
}

.story-playback-word{
  display:inline;
  color:rgba(255,255,255,.32);
  transition:color .35s ease,text-shadow .35s ease,background-color .35s ease;
}
.story-playback-word.is-read{
  color:rgba(255,255,255,.94);
}
.story-playback-word.is-current{
  color:#fff;
  background:rgba(101,232,255,.13);
  border-radius:.28em;
  text-shadow:0 0 14px rgba(101,232,255,.38);
}
.story-replay-note{
  margin-top:14px;
  max-width:620px;
  color:rgba(255,255,255,.72);
  font-size:.94rem;
  line-height:1.5;
  text-align:center;
}

/* v2.19 exact translated-gap flow
   Only the current learning-language word is hidden. Future target words remain
   visible, so every option set belongs unambiguously to the one highlighted blank. */
.story-text{
  text-wrap:wrap;
  overflow-wrap:normal;
  word-break:normal;
  hyphens:none;
}

.story-gap{
  display:inline-block;
  vertical-align:baseline;
  width:auto;
  min-width:clamp(68px, calc(var(--gap-ch, 7) * .72em), 178px);
  min-height:1.05em;
  margin:0 .08em;
  padding:0 .18em .05em;
  line-height:1;
  white-space:nowrap;
}

.story-gap-clue{
  display:inline;
  max-width:none;
  font-family:inherit;
  font-size:.72em;
  font-style:italic;
  line-height:1;
  color:rgba(223,250,255,.86);
  transform:none;
  overflow:visible;
}

.story-upcoming-word{
  color:inherit;
  text-shadow:none;
}

.story-correct{
  display:inline;
}

.story-active-card .story-option-block{
  min-height:52px;
  align-items:center;
}

@media(max-width:760px){
  .story-gap{
    min-width:clamp(58px, calc(var(--gap-ch, 7) * .68em), 132px);
    min-height:1em;
    padding-inline:.12em;
  }
}


/* v2.21: all four tested words are shown as numbered blanks at once. */
.story-gap-future{
  display:inline-block;
  opacity:.72;
  border-bottom-color:rgba(255,95,215,.52);
  background:rgba(255,255,255,.018);
}
.story-gap-active{
  opacity:1;
  border-bottom-color:#ff5fd7;
  background:rgba(101,232,255,.055);
  box-shadow:0 8px 20px rgba(101,232,255,.08);
}
.story-gap-clue{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:1.25em;
  color:rgba(223,250,255,.72);
  font-family:Arial,sans-serif;
  font-size:.42em;
  font-style:normal;
  font-weight:600;
}
.story-gap-active .story-gap-clue{
  color:#dffaff;
}

/* v2.22: unlimited story-block replay from the full-translation screen */
.translation-replay-button{
  border-color:rgba(255,95,215,.58);
  background:linear-gradient(135deg,rgba(255,95,215,.14),rgba(179,155,255,.10));
}
.translation-replay-button:hover{
  background:linear-gradient(135deg,rgba(255,95,215,.22),rgba(179,155,255,.16));
  box-shadow:0 0 24px rgba(255,95,215,.12);
}
.translation-secondary-button{
  color:#dce8ff;
  background:rgba(255,255,255,.035);
}

/* v2.25: every story gap displays the mother-language word as its clue.
   Number badges and numeric word progress were removed. */
.story-gap{
  min-width:clamp(92px, calc(var(--gap-ch, 8) * .72em), 230px);
  padding-inline:.28em;
}
.story-gap-clue{
  display:inline-block;
  max-width:210px;
  color:rgba(223,240,255,.82);
  font-family:Arial,sans-serif;
  font-size:.43em;
  font-style:normal;
  font-weight:500;
  line-height:1.05;
  letter-spacing:.01em;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.story-gap-future .story-gap-clue{
  color:rgba(214,229,255,.58);
}
.story-gap-active .story-gap-clue{
  color:#dffaff;
  text-shadow:0 0 12px rgba(101,232,255,.32);
}
@media(max-width:760px){
  .story-gap{min-width:clamp(78px, calc(var(--gap-ch, 8) * .66em), 168px);}
  .story-gap-clue{max-width:150px;font-size:.39em;}
}
