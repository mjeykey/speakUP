<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SpeakUP · Siren Project</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#01040a;color:#f4f7fb}body{font-family:Georgia,'Times New Roman',serif;overflow:hidden}.app{position:fixed;inset:0;background:radial-gradient(circle at 50% 12%,#183047 0,#07131f 36%,#02060b 72%);overflow:hidden}.storm{position:absolute;inset:0;width:100%;height:100%;z-index:1}.back{position:fixed;z-index:80;left:16px;top:16px;border:1px solid #ffffff33;background:#0008;color:#fff;border-radius:999px;padding:10px 15px;cursor:pointer}.scene{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}.copy{position:relative;z-index:30;text-align:center;width:min(850px,calc(100% - 40px));padding:30px;animation:rise 1.2s ease both}.kicker{font:11px system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#91a9bc}.copy h1{font-size:clamp(52px,10vw,112px);line-height:.94;margin:12px 0 24px;font-weight:400;letter-spacing:-.045em;text-shadow:0 12px 38px #000}.copy p{font-size:clamp(20px,3vw,31px);line-height:1.55;color:#e4ebf2;margin:0;text-shadow:0 7px 22px #000}.enter,.next,.research-btn{margin-top:28px;border:1px solid #ffffff3d;background:#ffffff12;color:#fff;padding:14px 21px;border-radius:999px;font:14px system-ui,sans-serif;cursor:pointer}.controls{position:fixed;z-index:50;bottom:20px;left:50%;transform:translateX(-50%);width:min(820px,calc(100% - 40px));display:flex;justify-content:space-between;align-items:center;font:12px system-ui,sans-serif;color:#8ca0b2;letter-spacing:.09em}.flash{position:absolute;inset:0;background:#e8f6ff;opacity:0;z-index:20;pointer-events:none}.flash.go{animation:flash .72s ease-out}.sound-note{margin-top:14px!important;font:12px system-ui,sans-serif!important;letter-spacing:.08em;color:#9db0c1!important}.document .scene{background:radial-gradient(circle,#2b2518 0,#090909 67%,#020203)}.paper{margin:28px auto 0;width:min(440px,100%);background:#dbcba7;color:#2c2419;padding:28px;text-align:left;box-shadow:0 30px 70px #000;transform:rotate(-1deg)}.paper p{color:#33291d;text-shadow:none;font-size:18px}.paper small{font:11px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#76654b}.research{position:absolute;inset:0;overflow:auto;background:radial-gradient(circle at 50% 0,#102233,#03080e 50%,#010307);padding:80px 20px;text-align:center}.research-inner{width:min(760px,100%);margin:auto}.secret{font:11px system-ui,sans-serif;letter-spacing:.2em;color:#91a9bc}.research h1{font-size:clamp(54px,10vw,100px);font-weight:400;margin:18px 0}.research .intro{font:20px/1.55 system-ui,sans-serif;color:#cbd7e2}.research-actions{display:grid;gap:12px;width:min(470px,100%);margin:30px auto}.research-btn{margin:0}.research-btn.primary{background:#eef6ff;color:#07111b}.privacy{width:min(550px,100%);margin:30px auto;text-align:left;border:1px solid #ffffff1f;border-radius:22px;padding:20px;background:#ffffff0a;font:14px/1.5 system-ui,sans-serif;color:#cbd6df}.privacy label{display:block;padding:9px 0}.mantra{margin-top:34px;font:11px system-ui,sans-serif;letter-spacing:.18em;color:#73889b}.blackout{position:absolute;inset:0;background:#000;display:grid;place-items:center;text-align:center;padding:30px}.blackout h1{font-size:clamp(46px,9vw,96px);font-weight:400;margin:0}.blackout p{font:14px system-ui,sans-serif;color:#9ba8b5;letter-spacing:.15em;margin-top:24px}@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}@keyframes flash{0%{opacity:0}10%{opacity:.95}21%{opacity:.06}33%{opacity:.48}100%{opacity:0}}@media(max-width:650px){.copy{padding:24px 12px}.copy p{font-size:19px}.controls{bottom:14px}}</style></head><body><div class="app" id="app"></div><button class="back" id="back">← SpeakUP</button><script type="module" src="src/siren-test/app.js?v=1"></script></body></html>
