<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SpeakUP · Siren Project</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#01040a;color:#f4f7fb}body{font-family:Georgia,'Times New Roman',serif;overflow:hidden}.app{position:fixed;inset:0;background:radial-gradient(circle at 50% 12%,#183047 0,#07131f 36%,#02060b 72%);overflow:hidden}.storm{position:absolute;inset:0;width:100%;height:100%;z-index:1}.back{position:fixed;z-index:80;left:16px;top:16px;border:1px solid #ffffff33;background:#0008;color:#fff;border-radius:999px;padding:10px 15px;cursor:pointer}.scene{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}.copy{position:relative;z-index:30;text-align:center;width:min(850px,calc(100% - 40px));padding:30px;animation:rise 1.2s ease both}.kicker{font:11px system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#91a9bc}.copy h1{font-size:clamp(52px,10vw,112px);line-height:.94;margin:12px 0 24px;font-weight:400;letter-spacing:-.045em;text-shadow:0 12px 38px #000}.copy p{font-size:clamp(20px,3vw,31px);line-height:1.55;color:#e4ebf2;margin:0;text-shadow:0 7px 22px #000}.enter,.next,.research-btn{margin-top:28px;border:1px solid #ffffff3d;background:#ffffff12;color:#fff;padding:14px 21px;border-radius:999px;font:14px system-ui,sans-serif;cursor:pointer}.controls{position:fixed;z-index:50;bottom:20px;left:50%;transform:translateX(-50%);width:min(820px,calc(100% - 40px));display:flex;justify-content:space-between;align-items:center;font:12px system-ui,sans-serif;color:#8ca0b2;letter-spacing:.09em}.flash{position:absolute;inset:0;background:#e8f6ff;opacity:0;z-index:20;pointer-events:none}.flash.go{animation:flash .65s ease-out}.document .scene{background:radial-gradient(circle,#2b2518 0,#090909 67%,#020203)}.paper{margin:28px auto 0;width:min(440px,100%);background:#dbcba7;color:#2c2419;padding:28px;text-align:left;box-shadow:0 30px 70px #000;transform:rotate(-1deg)}.paper p{color:#33291d;text-shadow:none;font-size:18px}.paper small{font:11px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#76654b}.research{position:absolute;inset:0;overflow:auto;background:radial-gradient(circle at 50% 0,#102233,#03080e 50%,#010307);padding:80px 20px;text-align:center}.research-inner{width:min(760px,100%);margin:auto}.secret{font:11px system-ui,sans-serif;letter-spacing:.2em;color:#91a9bc}.research h1{font-size:clamp(54px,10vw,100px);font-weight:400;margin:18px 0}.research .intro{font:20px/1.55 system-ui,sans-serif;color:#cbd7e2}.research-actions{display:grid;gap:12px;width:min(470px,100%);margin:30px auto}.research-btn{margin:0}.research-btn.primary{background:#eef6ff;color:#07111b}.privacy{width:min(550px,100%);margin:30px auto;text-align:left;border:1px solid #ffffff1f;border-radius:22px;padding:20px;background:#ffffff0a;font:14px/1.5 system-ui,sans-serif;color:#cbd6df}.privacy label{display:block;padding:9px 0}.mantra{margin-top:34px;font:11px system-ui,sans-serif;letter-spacing:.18em;color:#73889b}.blackout{position:absolute;inset:0;background:#000;display:grid;place-items:center;text-align:center;padding:30px}.blackout h1{font-size:clamp(46px,9vw,96px);font-weight:400;margin:0}.blackout p{font:14px system-ui,sans-serif;color:#9ba8b5;letter-spacing:.15em;margin-top:24px}@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}@keyframes flash{0%{opacity:0}15%{opacity:.85}28%{opacity:.08}42%{opacity:.5}100%{opacity:0}}@media(max-width:650px){.copy{padding:24px 12px}.copy p{font-size:19px}.controls{bottom:14px}}
</style></head><body><div class="app" id="app"></div><button class="back" onclick="stopStorm();location.href='./'">← SpeakUP</button><script>
const stages=[{t:'THE BLACK ROCK',k:'Kintyre, Scotland · 13 October 1811',b:`The sea should have been empty.<br><br>It wasn't.<br><br>John McIsaac saw the white shape before he saw the woman.`},{t:'IT MOVED',k:'A pale shape on black stone',b:`A head.<br>Shoulders.<br>Arms.<br>Long hair.<br><br>Human.<br><br>Almost.<br><br>Below the waist, the body narrowed into something darker — mottled, wet, ending in a broad tail.`},{t:'HE KEPT WATCHING',k:'Not seconds. Not minutes.',b:`John did not run.<br><br>According to the testimony he later gave, he watched for nearly two hours while the tide slowly pulled away from the rock.`},{t:'THE GIRL',k:'Elsewhere on the same coast',b:`Eight-year-old Catherine Loynachan saw something too.<br><br>She did not think it was a monster.<br><br>She thought a boy had fallen into the sea.`},{t:'THE TESTIMONY',k:'29 October 1811',b:`Sixteen days later, John sat before Duncan Campbell, Sheriff-Substitute of Kintyre.<br><br>He swore an oath.<br><br>His words were written down.`},{t:'THE DOCUMENTS SURVIVED',k:'More than two centuries later',b:`John McIsaac was real.<br>Catherine Loynachan was real.<br>Duncan Campbell was real.<br><br>The testimony survived.`,doc:true},{t:'WHAT DID THEY SEE?',k:'A sworn statement proves a statement was made — not that the witness understood what they saw.',b:`Seal?<br>Human?<br>Unknown marine animal?<br>Folklore?<br><br>There should be an ordinary explanation.<br><br>But the creature is gone.`},{t:'WERE THEY THE ONLY ONES?',k:'Kintyre was not the only place.',b:`Reay · 1809<br>Benbecula · c. 1830<br>Yell · 1833<br>Deerness · 1887–1899<br><br>Some stories were written down.<br>Others survived only in families.`}];
const app=document.getElementById('app');let i=-1,stormRAF,audioCtx,master,stormStarted=false,thunderTimer;
function stormMarkup(){return `<canvas class="storm" id="stormCanvas"></canvas><div class="flash" id="flash"></div>`}
function startCanvas(){cancelAnimationFrame(stormRAF);const c=document.getElementById('stormCanvas');if(!c)return;const x=c.getContext('2d');let W,H,drops=[];function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';drops=Array.from({length:Math.min(900,Math.floor(innerWidth*1.2))},()=>({x:Math.random()*W,y:Math.random()*H,l:(8+Math.random()*24)*devicePixelRatio,s:(12+Math.random()*18)*devicePixelRatio,a:.12+Math.random()*.35}))}resize();onresize=resize;let t=0;function draw(){t+=.012;x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071521');g.addColorStop(.55,'#07111a');g.addColorStop(1,'#010307');x.fillStyle=g;x.fillRect(0,0,W,H);const horizon=H*.62;x.fillStyle='#020a11';x.fillRect(0,horizon,W,H-horizon);for(let layer=0;layer<4;layer++){x.beginPath();const base=horizon+layer*H*.075;for(let px=0;px<=W;px+=12*devicePixelRatio){const yy=base+Math.sin(px/(95*devicePixelRatio)+t*(1.3+layer*.35)+layer)*((15+layer*9)*devicePixelRatio)+Math.sin(px/(37*devicePixelRatio)-t*2)*(5*devicePixelRatio);px?x.lineTo(px,yy):x.moveTo(px,yy)}x.lineTo(W,H);x.lineTo(0,H);x.closePath();x.fillStyle=`rgba(${8+layer*4},${30+layer*8},${43+layer*10},${.9-layer*.08})`;x.fill();x.beginPath();for(let px=0;px<=W;px+=12*devicePixelRatio){const yy=base+Math.sin(px/(95*devicePixelRatio)+t*(1.3+layer*.35)+layer)*((15+layer*9)*devicePixelRatio)+Math.sin(px/(37*devicePixelRatio)-t*2)*(5*devicePixelRatio);px?x.lineTo(px,yy):x.moveTo(px,yy)}x.strokeStyle=`rgba(185,218,230,${.12-layer*.018})`;x.lineWidth=(1.3+layer*.4)*devicePixelRatio;x.stroke()}x.lineCap='round';for(const d of drops){x.beginPath();x.moveTo(d.x,d.y);x.lineTo(d.x-d.l*.28,d.y+d.l);x.strokeStyle=`rgba(205,229,239,${d.a})`;x.lineWidth=.75*devicePixelRatio;x.stroke();d.x-=d.s*.18;d.y+=d.s;if(d.y>H||d.x<0){d.x=Math.random()*W+W*.1;d.y=-40*devicePixelRatio}}stormRAF=requestAnimationFrame(draw)}draw()}
function noiseBuffer(ctx,seconds){const b=ctx.createBuffer(1,ctx.sampleRate*seconds,ctx.sampleRate),d=b.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=Math.random()*2-1;return b}
function startSound(){if(stormStarted)return;stormStarted=true;audioCtx=new (window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.38;master.connect(audioCtx.destination);const rain=audioCtx.createBufferSource();rain.buffer=noiseBuffer(audioCtx,2);rain.loop=true;const rf=audioCtx.createBiquadFilter();rf.type='highpass';rf.frequency.value=900;const rg=audioCtx.createGain();rg.gain.value=.22;rain.connect(rf).connect(rg).connect(master);rain.start();const wind=audioCtx.createBufferSource();wind.buffer=noiseBuffer(audioCtx,3);wind.loop=true;const wf=audioCtx.createBiquadFilter();wf.type='lowpass';wf.frequency.value=430;const wg=audioCtx.createGain();wg.gain.value=.22;wind.connect(wf).connect(wg).connect(master);wind.start();scheduleThunder()}
function scheduleThunder(){clearTimeout(thunderTimer);thunderTimer=setTimeout(()=>{if(!audioCtx)return;const f=document.getElementById('flash');if(f){f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}const src=audioCtx.createBufferSource();src.buffer=noiseBuffer(audioCtx,1.8);const lp=audioCtx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=150;const g=audioCtx.createGain();g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.9,audioCtx.currentTime+.05);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+1.7);src.connect(lp).connect(g).connect(master);src.start();scheduleThunder()},5000+Math.random()*7000)}
function stopStorm(){cancelAnimationFrame(stormRAF);clearTimeout(thunderTimer);if(audioCtx)audioCtx.close()}
function intro(){app.innerHTML=`<section class="scene">${stormMarkup()}<div class="copy"><div class="kicker">STORY MODE · HIDDEN TEST</div><h1>The Black Rock</h1><p>Headphones recommended.<br><br>This begins as a story.</p><button class="enter" id="enter">Enter the storm</button></div></section>`;startCanvas();document.getElementById('enter').onclick=()=>{startSound();i=0;stage()}}
function stage(){if(i>=stages.length){blackout();return}const s=stages[i];app.className=s.doc?'app document':'app';app.innerHTML=`<section class="scene">${stormMarkup()}<div class="copy"><div class="kicker">${s.k}</div><h1>${s.t}</h1><p>${s.b}</p>${s.doc?`<div class="paper"><div style="font-size:32px">1811</div><p>Deposition recorded before the Sheriff-Substitute of Kintyre.</p><small>Archive record survives</small></div>`:''}</div></section><div class="controls"><span>${String(i+1).padStart(2,'0')} / 08</span><button class="next" id="next">${i===7?'Continue into the dark':'Continue'}</button></div>`;startCanvas();document.getElementById('next').onclick=()=>{i++;stage()}}
function blackout(){cancelAnimationFrame(stormRAF);app.className='app';app.innerHTML=`<div class="blackout"><div><h1>WERE THEY THE ONLY ONES?</h1><p>SOME STORIES WERE NEVER WRITTEN DOWN.</p><button class="next" id="reveal">I want to know</button></div></div>`;document.getElementById('reveal').onclick=research}
function research(){if(master)master.gain.setTargetAtTime(.08,audioCtx.currentTime,.8);app.innerHTML=`<section class="research"><div class="research-inner"><div class="secret">YOU FOUND SOMETHING MOST PEOPLE WILL NEVER SEE.</div><div style="font-size:50px;margin-top:22px">🧜‍♀️</div><h1>THE SIREN PROJECT</h1><p class="intro">We are not here to prove mermaids exist.<br>We are here to find out what people actually saw.</p><div class="research-actions"><button class="research-btn primary">I KNOW A STORY</button><button class="research-btn">I FOUND EVIDENCE</button></div><div class="privacy"><p>Choose how a contribution may be used:</p><label><input type="radio" name="p" checked> Publish anonymously</label><label><input type="radio" name="p"> Research use only — do not publish</label><label><input type="checkbox"> The research team may contact me</label></div><div class="mantra">OBSERVE · PRESERVE · VERIFY · INVESTIGATE</div></div></section>`}
intro();</script></body></html>
