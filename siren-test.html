<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpeakUP · The Siren Project Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#01040a;color:#f4f7fb}body{font-family:Georgia,'Times New Roman',serif;overflow:hidden}.app{position:fixed;inset:0;background:radial-gradient(circle at 50% 12%,#183047 0,#07131f 36%,#02060b 72%);overflow:hidden}.back{position:fixed;z-index:50;left:max(16px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.42);color:white;border-radius:999px;padding:10px 15px;cursor:pointer}.scene{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}.copy{position:relative;z-index:10;text-align:center;width:min(850px,calc(100% - 40px));padding:30px;animation:rise 1.2s ease both}.kicker{font:11px/1.4 system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#91a9bc}.copy h1{font-size:clamp(52px,10vw,112px);line-height:.94;margin:12px 0 24px;font-weight:400;letter-spacing:-.045em;text-shadow:0 12px 38px #000}.copy p{font-size:clamp(20px,3vw,31px);line-height:1.55;color:#e4ebf2;margin:0;text-shadow:0 7px 22px #000}.enter,.next,.research-btn{margin-top:28px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.07);color:#fff;padding:14px 21px;border-radius:999px;font:14px system-ui,sans-serif;cursor:pointer}.enter:hover,.next:hover,.research-btn:hover{background:rgba(255,255,255,.14)}.controls{position:fixed;z-index:30;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(820px,calc(100% - 40px));display:flex;justify-content:space-between;align-items:center;font:12px system-ui,sans-serif;color:#8ca0b2;letter-spacing:.09em}.sea{position:absolute;left:-12%;right:-12%;bottom:-5%;height:43%;background:linear-gradient(rgba(10,36,53,.08),#030b12 25%,#010307 76%);box-shadow:0 -35px 110px rgba(62,141,180,.09)}.wave{position:absolute;left:-20%;width:140%;height:90px;border-radius:50%;background:rgba(118,167,189,.09);filter:blur(8px);animation:wave 7s ease-in-out infinite alternate}.w1{bottom:15%}.w2{bottom:6%;animation-duration:9s}.noise{position:absolute;inset:0;opacity:.11;background-image:radial-gradient(rgba(255,255,255,.24) .6px,transparent .7px);background-size:5px 5px}.flash{position:absolute;inset:0;background:#ddf1ff;opacity:0;z-index:8;pointer-events:none;mix-blend-mode:screen;animation:flash 8s 2s infinite}.flash.two{animation:flash2 13s 5.4s infinite}.document .scene{background:radial-gradient(circle,#2b2518 0,#090909 67%,#020203)}.paper{margin:30px auto 0;width:min(440px,100%);background:#dbcba7;color:#2c2419;padding:28px;text-align:left;box-shadow:0 30px 70px #000;transform:rotate(-1deg);position:relative}.paper:after{content:'';position:absolute;inset:9px;border:1px solid rgba(72,57,34,.3)}.paper .year{font-size:32px;letter-spacing:.12em}.paper p{color:#33291d;text-shadow:none;font-size:18px;line-height:1.45}.paper small{font:11px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#76654b}.research{position:absolute;inset:0;overflow:auto;background:radial-gradient(circle at 50% 0,#102233 0,#03080e 50%,#010307 100%);padding:80px 20px 70px;text-align:center}.research-inner{width:min(760px,100%);margin:0 auto}.secret{font:11px system-ui,sans-serif;letter-spacing:.2em;color:#91a9bc}.research h1{font-size:clamp(54px,10vw,100px);font-weight:400;letter-spacing:-.05em;margin:18px 0}.research .intro{font:20px/1.55 system-ui,sans-serif;color:#cbd7e2}.research-actions{display:grid;gap:12px;width:min(470px,100%);margin:30px auto}.research-btn{margin:0}.research-btn.primary{background:#eef6ff;color:#07111b}.privacy{width:min(550px,100%);margin:30px auto;text-align:left;border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:20px;background:rgba(255,255,255,.04);font:14px/1.5 system-ui,sans-serif;color:#cbd6df}.privacy label{display:block;padding:9px 0}.mantra{margin-top:34px;font:11px system-ui,sans-serif;letter-spacing:.18em;color:#73889b}.blackout{position:absolute;inset:0;background:#000;display:grid;place-items:center;text-align:center;padding:30px}.blackout h1{font-size:clamp(46px,9vw,96px);font-weight:400;letter-spacing:-.04em;margin:0;animation:pulse 2.4s ease-in-out infinite}.blackout p{font:14px system-ui,sans-serif;color:#9ba8b5;letter-spacing:.15em;margin-top:24px}@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}@keyframes wave{from{transform:translateX(-3%) scaleY(.8) rotate(-1deg)}to{transform:translateX(3%) scaleY(1.25) rotate(1deg)}}@keyframes flash{0%,85%,100%{opacity:0}86%{opacity:.85}86.6%{opacity:.05}87.2%{opacity:.42}88%{opacity:0}}@keyframes flash2{0%,91%,100%{opacity:0}92%{opacity:.4}92.5%{opacity:0}93%{opacity:.2}94%{opacity:0}}@keyframes pulse{0%,100%{opacity:.62}50%{opacity:1}}@media(max-width:650px){.copy{padding:24px 12px}.copy p{font-size:19px}.controls{bottom:14px}.paper{padding:22px}.back{top:12px;left:12px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<button class="back" onclick="location.href='./'">← SpeakUP</button>
<script>
const stages=[
{t:'THE BLACK ROCK',k:'Kintyre, Scotland · 13 October 1811',b:`The sea should have been empty.<br><br>It wasn't.<br><br>John McIsaac saw the white shape before he saw the woman.`},
{t:'IT MOVED',k:'A pale shape on black stone',b:`A head.<br>Shoulders.<br>Arms.<br>Long hair.<br><br>Human.<br><br>Almost.<br><br>Below the waist, the body narrowed into something darker — mottled, wet, ending in a broad tail.`},
{t:'HE KEPT WATCHING',k:'Not seconds. Not minutes.',b:`John did not run.<br><br>According to the testimony he later gave, he watched for nearly two hours while the tide slowly pulled away from the rock.`},
{t:'THE GIRL',k:'Elsewhere on the same coast',b:`Eight-year-old Catherine Loynachan saw something too.<br><br>She did not think it was a monster.<br><br>She thought a boy had fallen into the sea.`},
{t:'THE TESTIMONY',k:'29 October 1811',b:`Sixteen days later, John sat before Duncan Campbell, Sheriff-Substitute of Kintyre.<br><br>He swore an oath.<br><br>His words were written down.`},
{t:'THE DOCUMENTS SURVIVED',k:'More than two centuries later',b:`John McIsaac was real.<br>Catherine Loynachan was real.<br>Duncan Campbell was real.<br><br>The testimony survived.`,doc:true},
{t:'WHAT DID THEY SEE?',k:'A sworn statement proves a statement was made — not that the witness understood what they saw.',b:`Seal?<br>Human?<br>Unknown marine animal?<br>Folklore?<br><br>There should be an ordinary explanation.<br><br>But the creature is gone.`},
{t:'WERE THEY THE ONLY ONES?',k:'Kintyre was not the only place.',b:`Reay · 1809<br>Benbecula · c. 1830<br>Yell · 1833<br>Deerness · 1887–1899<br><br>Some stories were written down.<br>Others survived only in families.`}
];
const app=document.getElementById('app');let i=-1;
function sea(){return `<div class="noise"></div><div class="flash"></div><div class="flash two"></div><div class="sea"></div><div class="wave w1"></div><div class="wave w2"></div>`}
function intro(){app.innerHTML=`<section class="scene">${sea()}<div class="copy"><div class="kicker">STORY MODE · HIDDEN TEST</div><h1>The Black Rock</h1><p>Headphones recommended.<br><br>This begins as a story.</p><button class="enter" id="enter">Enter the story</button></div></section>`;document.getElementById('enter').onclick=()=>{i=0;stage()}}
function stage(){if(i>=stages.length){blackout();return}const s=stages[i];app.className=s.doc?'app document':'app';app.innerHTML=`<section class="scene">${sea()}<div class="copy"><div class="kicker">${s.k}</div><h1>${s.t}</h1><p>${s.b}</p>${s.doc?`<div class="paper"><div class="year">1811</div><p>Deposition recorded before the Sheriff-Substitute of Kintyre.</p><small>Archive record survives</small></div>`:''}</div></section><div class="controls"><span>${String(i+1).padStart(2,'0')} / ${String(stages.length).padStart(2,'0')}</span><button class="next" id="next">${i===stages.length-1?'Continue into the dark':'Continue'}</button></div>`;document.getElementById('next').onclick=()=>{i++;stage()}}
function blackout(){app.className='app';app.innerHTML=`<div class="blackout"><div><h1>WERE THEY THE ONLY ONES?</h1><p>SOME STORIES WERE NEVER WRITTEN DOWN.</p><button class="next" id="reveal">I want to know</button></div></div>`;document.getElementById('reveal').onclick=research}
function research(){app.innerHTML=`<section class="research"><div class="research-inner"><div class="secret">YOU FOUND SOMETHING MOST PEOPLE WILL NEVER SEE.</div><div style="font-size:50px;margin-top:22px">🧜‍♀️</div><h1>THE SIREN PROJECT</h1><p class="intro">We are not here to prove mermaids exist.<br>We are here to find out what people actually saw.</p><div class="research-actions"><button class="research-btn primary" onclick="demo(this)">I KNOW A STORY</button><button class="research-btn" onclick="demo(this)">I FOUND EVIDENCE</button></div><div class="privacy"><p>Choose how a contribution may be used:</p><label><input type="radio" name="p" checked> Publish anonymously</label><label><input type="radio" name="p"> Research use only — do not publish</label><label><input type="checkbox"> The research team may contact me</label></div><div class="mantra">OBSERVE · PRESERVE · VERIFY · INVESTIGATE</div></div></section>`}
function demo(btn){const t=btn.textContent;btn.textContent='TEST MODE — FORM COMES NEXT';btn.disabled=true;setTimeout(()=>{btn.textContent=t;btn.disabled=false},1600)}
intro();
</script>
</body>
</html>
