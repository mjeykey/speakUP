name: SpeakUP Live Browser QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run static QA
        run: npm test
      - name: Wait for GitHub Pages
        run: |
          for i in {1..30}; do
            if curl -fsSL https://mjeykey.github.io/speakUP/ | grep -q 'src/app/main.js?v=337'; then
              exit 0
            fi
            sleep 5
          done
          echo "Expected live build was not available."
          exit 1
      - name: Run live browser smoke tests
        env:
          PLAYWRIGHT_BASE_URL: https://mjeykey.github.io/speakUP/
        run: npx playwright test tests/smoke.spec.js
