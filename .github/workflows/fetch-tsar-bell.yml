name: Fetch exact Tsar bell audio

on:
  push:
    branches: [main]
    paths:
      - .fetch-tsar-bell-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-tsar-bell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact SoundReality Tsar bell MP3 from Pixabay
        shell: python
        run: |
          import hashlib, html as htmlmod, pathlib, re, urllib.parse, urllib.request

          page = 'https://pixabay.com/sound-effects/film-special-effects-tsar-bell-sound-simulation-292699/'
          target_sha = '969c6cd233d572236af16ab79510c16e6f7dbbe9402998cbc1a5b6ed15d8bd58'
          target_size = 1601280

          req = urllib.request.Request(page, headers={'User-Agent':'Mozilla/5.0'})
          raw = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'ignore')
          text = htmlmod.unescape(raw).replace('\\u0026', '&').replace('\\/', '/')
          text = urllib.parse.unquote(text)
          urls = re.findall(r'https://cdn\.pixabay\.com/[^\"\'<> ]+?\.mp3(?:\?[^\"\'<> ]*)?', text)
          urls = list(dict.fromkeys(urls))
          preferred = [u for u in urls if '292699' in u or 'tsar' in u.lower() or 'bell' in u.lower()]
          candidates = preferred or urls
          if not candidates:
              raise SystemExit('No Pixabay MP3 URL found on page')

          found = None
          seen = []
          for url in candidates:
              try:
                  req2 = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Referer':'https://pixabay.com/'})
                  data = urllib.request.urlopen(req2, timeout=60).read()
                  sha = hashlib.sha256(data).hexdigest()
                  seen.append((len(data), sha, url))
                  print(f'Candidate {len(data)} bytes sha256={sha} {url}')
                  if len(data) == target_size and sha == target_sha:
                      found = data
                      break
              except Exception as exc:
                  print(f'Candidate failed: {url}: {exc}')

          if found is None:
              raise SystemExit('Exact uploaded Tsar bell not found. Seen: ' + repr(seen[:20]))

          out = pathlib.Path('assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(found)
          print(f'VERIFIED exact user MP3: {len(found)} bytes sha256={hashlib.sha256(found).hexdigest()}')

      - name: Commit exact Tsar bell audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3
          if git diff --cached --quiet; then
            echo "Exact Tsar bell already current"
          else
            git commit -m "Add exact uploaded SoundReality Tsar bell MP3"
            git push
          fi
