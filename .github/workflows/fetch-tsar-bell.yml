name: Wire verified Tsar bell

on:
  push:
    branches: [main]
    paths:
      - '.fetch-tsar-bell-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-verified-bell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact user MP3
        shell: bash
        run: |
          set -euo pipefail
          FILE='assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3'
          test -f "$FILE"
          test "$(wc -c < "$FILE" | tr -d ' ')" = '1601280'
          test "$(sha256sum "$FILE" | awk '{print $1}')" = '969c6cd233d572236af16ab79510c16e6f7dbbe9402998cbc1a5b6ed15d8bd58'
          echo 'Exact uploaded Tsar bell verified.'

      - name: Wire Story Mode directly to verified MP3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/audio/story-sfx.js')
          text = path.read_text(encoding='utf-8')

          text, count = re.subn(
              r"let bellMp3Url = '';\nlet bellMp3UrlPromise = null;\n",
              "const BELL_MP3_URL = new URL('../../assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3', import.meta.url).href;\nlet bellMp3Url = BELL_MP3_URL;\n",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('bell URL state replacement failed')

          text, count = re.subn(
              r"// Exact uploaded 50\.04 s Tsar church-bell recording, stored as 17 Base64 parts in this repository\.\nconst BELL_MP3_PART_URLS = Array\.from\(\{ length: 17 \}, \(_, index\) =>\n  `https://raw\.githubusercontent\.com/mjeykey/speakUP/main/\.bell-tsar/p\$\{String\(index\)\.padStart\(2, '0'\)\}\.b64`\n\);\n",
              "// Exact verified 50.04 s user-uploaded Tsar church-bell recording.\n",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('old 17-part bell definition replacement failed')

          direct = '''async function getBellMp3Url() {
  const audio = ensureBellAudio();
  bellMp3Url = BELL_MP3_URL;
  if (audio.src !== BELL_MP3_URL) {
    audio.src = BELL_MP3_URL;
    audio.load();
  }
  return BELL_MP3_URL;
}

async function sourceArrayBuffer'''
          text, count = re.subn(
              r"async function getBellMp3Url\(\) \{.*?\n\}\n\nasync function sourceArrayBuffer",
              direct,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('bell rebuild function replacement failed')

          text = text.replace(
              "// When already rebuilt, play() stays inside the user's Story navigation gesture.",
              "// Direct verified MP3 keeps play() inside the user's Story navigation gesture."
          )
          text = text.replace(
              "// Build the exact uploaded church-bell recording immediately so page 5 can\n  // start it synchronously from the user's navigation gesture.",
              "// Preload the exact verified church-bell MP3 so page 5 can\n  // start it synchronously from the user's navigation gesture."
          )
          path.write_text(text, encoding='utf-8')

          def bump(path_string, pattern):
              p = Path(path_string)
              value = p.read_text(encoding='utf-8')
              match = re.search(pattern, value)
              if not match:
                  raise SystemExit(f'cache version not found in {path_string}')
              old = int(match.group(1))
              value = value[:match.start(1)] + str(old + 1) + value[match.end(1):]
              p.write_text(value, encoding='utf-8')
              print(f'{path_string}: {old} -> {old + 1}')

          bump('src/modules/story.js', r"story-sfx\.js\?v=(\d+)")
          bump('src/modules/story-loader.js', r"story\.js\?v=(\d+)")
          bump('src/app/main.js', r"story-loader\.js\?v=(\d+)")
          bump('index.html', r"src/app/main\.js\?v=(\d+)")
          PY

          rm -rf .bell-upload .bell-tsar

      - name: Commit direct exact bell wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m 'Use exact uploaded Tsar bell directly on Story pages 5-8'
          git push
