name: Install exact uploaded Tsar bell

on:
  push:
    branches: [main]
    paths:
      - '.bell-upload/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-tsar-bell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact uploaded MP3
        shell: bash
        run: |
          set -euo pipefail
          test -d .bell-upload
          cat .bell-upload/part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/tsar.mp3
          size=$(wc -c < /tmp/tsar.mp3 | tr -d ' ')
          sha=$(sha256sum /tmp/tsar.mp3 | awk '{print $1}')
          echo "size=$size"
          echo "sha256=$sha"
          test "$size" = "1601280"
          test "$sha" = "969c6cd233d572236af16ab79510c16e6f7dbbe9402998cbc1a5b6ed15d8bd58"
          mkdir -p assets/audio
          cp /tmp/tsar.mp3 assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3

      - name: Commit exact user MP3 and remove transport chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3
          git rm -r .bell-upload
          git commit -m "Install exact uploaded Tsar bell MP3"
          git push
