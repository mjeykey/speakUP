name: Fetch exact Tsar bell audio

on:
  push:
    branches: [main]
    paths:
      - .fetch-tsar-bell-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-tsar-bell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install browser helper
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fetch and verify the exact uploaded Tsar bell
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');

          const PAGE_URL = 'https://pixabay.com/sound-effects/film-special-effects-tsar-bell-sound-simulation-292699/';
          const TARGET_SHA = '969c6cd233d572236af16ab79510c16e6f7dbbe9402998cbc1a5b6ed15d8bd58';
          const TARGET_SIZE = 1601280;
          const OUT = 'assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3';
          const report = [];
          const candidates = new Set();
          const add = value => {
            if (!value || typeof value !== 'string') return;
            const clean = value.replace(/\\u0026/g, '&').replace(/\\\//g, '/');
            if (/\.mp3(?:\?|$)/i.test(clean)) candidates.add(clean);
          };
          const sha256 = data => crypto.createHash('sha256').update(data).digest('hex');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
              locale: 'en-US',
              extraHTTPHeaders: { 'Accept-Language': 'en-US,en;q=0.9' }
            });
            const page = await context.newPage();

            page.on('request', request => add(request.url()));
            page.on('response', response => {
              const url = response.url();
              const type = response.headers()['content-type'] || '';
              if (/audio|mpeg/i.test(type) || /\.mp3(?:\?|$)/i.test(url)) add(url);
            });

            try {
              const response = await page.goto(PAGE_URL, { waitUntil: 'domcontentloaded', timeout: 120000 });
              report.push(`page_status=${response ? response.status() : 'none'}`);
              report.push(`page_title=${await page.title()}`);
              await page.waitForTimeout(7000);

              const media = await page.locator('audio, source').evaluateAll(nodes => nodes.flatMap(node => [
                node.src,
                node.currentSrc,
                node.getAttribute && node.getAttribute('src')
              ]).filter(Boolean));
              media.forEach(add);

              const links = await page.locator('a').evaluateAll(nodes => nodes.map(node => node.href).filter(Boolean));
              links.forEach(add);

              const html = await page.content();
              const matches = html.match(/https:\/\/[^\"'<>\\ ]+?\.mp3(?:\?[^\"'<>\\ ]*)?/gi) || [];
              matches.forEach(add);

              const playSelectors = [
                'button[aria-label*="play" i]',
                'button[title*="play" i]',
                '[role="button"][aria-label*="play" i]'
              ];
              for (const selector of playSelectors) {
                const button = page.locator(selector).first();
                if (await button.count()) {
                  try {
                    await button.click({ timeout: 5000 });
                    await page.waitForTimeout(5000);
                    report.push(`clicked_play=${selector}`);
                    break;
                  } catch (error) {
                    report.push(`play_click_error=${String(error).slice(0,180)}`);
                  }
                }
              }

              const mediaAfter = await page.locator('audio, source').evaluateAll(nodes => nodes.flatMap(node => [
                node.src,
                node.currentSrc,
                node.getAttribute && node.getAttribute('src')
              ]).filter(Boolean));
              mediaAfter.forEach(add);

              report.push(`candidate_count=${candidates.size}`);
              let exact = null;
              let index = 0;
              for (const url of candidates) {
                try {
                  const response = await context.request.get(url, {
                    headers: { Referer: PAGE_URL },
                    timeout: 120000
                  });
                  const body = await response.body();
                  const hash = sha256(body);
                  report.push(`${index}: status=${response.status()} size=${body.length} sha256=${hash} url=${url}`);
                  if (body.length === TARGET_SIZE && hash === TARGET_SHA) {
                    exact = body;
                    report.push('MATCH=EXACT_CHAT_UPLOAD');
                    break;
                  }
                } catch (error) {
                  report.push(`${index}: fetch_error=${String(error).slice(0,300)} url=${url}`);
                }
                index += 1;
              }

              if (!exact) {
                try {
                  const downloadButton = page.getByText(/^download$/i).first();
                  if (await downloadButton.count()) {
                    const downloadPromise = page.waitForEvent('download', { timeout: 15000 }).catch(() => null);
                    await downloadButton.click({ timeout: 8000 }).catch(() => {});
                    const download = await downloadPromise;
                    if (download) {
                      const tmp = await download.path();
                      if (tmp) {
                        const body = fs.readFileSync(tmp);
                        const hash = sha256(body);
                        report.push(`download_event size=${body.length} sha256=${hash}`);
                        if (body.length === TARGET_SIZE && hash === TARGET_SHA) {
                          exact = body;
                          report.push('MATCH=EXACT_CHAT_UPLOAD_VIA_DOWNLOAD');
                        }
                      }
                    }
                  }
                } catch (error) {
                  report.push(`download_error=${String(error).slice(0,300)}`);
                }
              }

              if (exact) {
                fs.mkdirSync(path.dirname(OUT), { recursive: true });
                fs.writeFileSync(OUT, exact);
                report.push(`written_size=${exact.length}`);
                report.push(`written_sha256=${sha256(exact)}`);
              } else {
                report.push('written_size=0');
              }
            } catch (error) {
              report.push(`BROWSER_ERROR=${String(error).slice(0,1000)}`);
              report.push('written_size=0');
            } finally {
              await browser.close();
              fs.writeFileSync('.tsar-bell-report.txt', report.join('\n') + '\n');
              console.log(report.join('\n'));
            }
          })().catch(error => {
            fs.writeFileSync('.tsar-bell-report.txt', `FATAL=${String(error)}\nwritten_size=0\n`);
            process.exitCode = 1;
          });
          NODE

      - name: Commit only an exact match and the diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tsar-bell-report.txt
          if [ -f assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3 ]; then
            actual_size=$(stat -c%s assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3)
            actual_sha=$(sha256sum assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3 | awk '{print $1}')
            test "$actual_size" = "1601280"
            test "$actual_sha" = "969c6cd233d572236af16ab79510c16e6f7dbbe9402998cbc1a5b6ed15d8bd58"
            git add assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3
          fi
          if git diff --cached --quiet; then
            echo "No Tsar bell changes"
          else
            git commit -m "Fetch exact uploaded Tsar bell audio"
            git push
          fi
