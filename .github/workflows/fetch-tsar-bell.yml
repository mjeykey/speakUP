name: Fetch exact Tsar bell audio

on:
  push:
    branches: [main]
    paths:
      - .fetch-tsar-bell-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-tsar-bell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch SoundReality Tsar bell and record verification
        shell: python
        run: |
          import hashlib, html as htmlmod, pathlib, re, urllib.parse, urllib.request

          page = 'https://pixabay.com/sound-effects/film-special-effects-tsar-bell-sound-simulation-292699/'
          target_sha = '969c6cd233d572236af16ab79510c16e6f7dbbe9402998cbc1a5b6ed15d8bd58'
          target_size = 1601280
          report = []

          req = urllib.request.Request(page, headers={'User-Agent':'Mozilla/5.0'})
          raw = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'ignore')
          text = htmlmod.unescape(raw).replace('\\u0026', '&').replace('\\/', '/')
          text = urllib.parse.unquote(text)
          urls = re.findall(r'https://cdn\.pixabay\.com/[^\"\'<> ]+?\.mp3(?:\?[^\"\'<> ]*)?', text)
          urls = list(dict.fromkeys(urls))
          report.append(f'page_bytes={len(raw.encode("utf-8"))}')
          report.append(f'candidate_urls={len(urls)}')

          preferred = [u for u in urls if '292699' in u or 'tsar' in u.lower() or 'bell' in u.lower()]
          candidates = preferred + [u for u in urls if u not in preferred]
          chosen = None
          exact = False

          for i, url in enumerate(candidates[:40]):
              try:
                  req2 = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Referer':'https://pixabay.com/'})
                  data = urllib.request.urlopen(req2, timeout=60).read()
                  sha = hashlib.sha256(data).hexdigest()
                  report.append(f'{i}: size={len(data)} sha256={sha} url={url}')
                  if sha == target_sha and len(data) == target_size:
                      chosen = data
                      exact = True
                      report.append('MATCH=EXACT_USER_UPLOAD')
                      break
                  if chosen is None and len(data) > 100000 and ('292699' in url or 'tsar' in url.lower() or 'bell' in url.lower()):
                      chosen = data
              except Exception as exc:
                  report.append(f'{i}: ERROR {url}: {exc!r}')

          if not urls:
              interesting = [line.strip() for line in raw.splitlines() if '292699' in line or '.mp3' in line or 'cdn.pixabay' in line]
              report.append('NO_DIRECT_URLS')
              report.extend(interesting[:30])

          if chosen is not None:
              out = pathlib.Path('assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3')
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(chosen)
              report.append(f'written_size={len(chosen)}')
              report.append(f'written_sha256={hashlib.sha256(chosen).hexdigest()}')
              report.append(f'exact={exact}')
          else:
              report.append('written_size=0')

          pathlib.Path('.tsar-bell-report.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))

      - name: Commit Tsar bell candidate and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tsar-bell-report.txt
          if [ -f assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3 ]; then
            git add assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3
          fi
          if git diff --cached --quiet; then
            echo "No Tsar bell diagnostic changes"
          else
            git commit -m "Fetch and verify SoundReality Tsar bell audio"
            git push
          fi
