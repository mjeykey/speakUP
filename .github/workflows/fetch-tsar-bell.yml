name: Install uploaded Tsar bell

on:
  push:
    branches: [main]
    paths:
      - '.bell-upload/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-tsar-bell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild uploaded bell MP3
        shell: bash
        run: |
          set -euo pipefail
          test -f .bell-upload/READY
          cat .bell-upload/part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/tsar.mp3
          size=$(wc -c < /tmp/tsar.mp3 | tr -d ' ')
          sha=$(sha256sum /tmp/tsar.mp3 | awk '{print $1}')
          echo "size=$size"
          echo "sha256=$sha"
          test "$size" = "200637"
          test "$sha" = "e399cbed63cccbc5321322e105a6c4fa615dc16199d19fc84ea594b8ff75cbcd"
          mkdir -p assets/audio
          cp /tmp/tsar.mp3 assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3

      - name: Commit bell and remove transport chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3
          git rm -r .bell-upload
          git commit -m "Install uploaded Tsar bell MP3"
          git push
