name: Install uploaded church bell

on:
  push:
    paths:
      - '.bell-upload/ready'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild uploaded MP3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          cat .bell-upload/part00.b64 \
              .bell-upload/part01.b64 \
              .bell-upload/part02.b64 \
              .bell-upload/part03.b64 \
            | base64 --decode \
            > assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3
          echo 'dcba080e60e716d0ba4684b3b26996babd468f61e88bbcc78d6f9736db134250  assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3' | sha256sum --check

      - name: Commit installed audio and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bell-upload
          rm -f .github/workflows/install-church-bell.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install uploaded Tsar church bell MP3'
          git push
