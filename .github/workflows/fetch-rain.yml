name: Fetch full rain audio

on:
  push:
    branches: [main]
    paths:
      - .fetch-rain-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-rain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download full JuliusH rain MP3 from Pixabay
        shell: python
        run: |
          import re, pathlib, urllib.request
          page = 'https://pixabay.com/sound-effects/nature-rain-on-roof-or-window-nature-sounds-8312/'
          req = urllib.request.Request(page, headers={'User-Agent':'Mozilla/5.0'})
          html = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'ignore')
          urls = re.findall(r'https://cdn\.pixabay\.com/[^\"\']+?\.mp3(?:\?[^\"\']*)?', html)
          if not urls:
              raise SystemExit('No Pixabay MP3 URL found on page')
          candidates = [u.replace('\\u0026','&') for u in urls]
          url = next((u for u in candidates if '8312' in u or 'rain' in u.lower()), candidates[0])
          out = pathlib.Path('assets/audio/rain-full.mp3')
          out.parent.mkdir(parents=True, exist_ok=True)
          req2 = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Referer':'https://pixabay.com/'})
          data = urllib.request.urlopen(req2, timeout=60).read()
          if len(data) < 100000:
              raise SystemExit(f'Download too small: {len(data)} bytes from {url}')
          out.write_bytes(data)
          print(f'Downloaded {len(data)} bytes from {url}')
      - name: Commit full rain audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/rain-full.mp3
          if git diff --cached --quiet; then
            echo "Rain audio already current"
          else
            git commit -m "Add full 42-second rain audio"
            git push
          fi
