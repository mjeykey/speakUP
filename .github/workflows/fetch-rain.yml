name: Fetch exact rain audio

on:
  push:
    branches: [main]
    paths:
      - .fetch-rain-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-rain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and verify exact JuliusH rain MP3
        shell: python
        run: |
          import base64
          import hashlib
          import html as htmlmod
          import pathlib
          import re
          import urllib.request

          page = 'https://pixabay.com/sound-effects/nature-rain-on-roof-or-window-nature-sounds-8312/'
          expected_mp3_sha = '06cb051221127bfa6f56ca93c33e3e3c7f67d3e5fae48d205579d48d55bf1d9a'
          expected_b64_sha = '19f50eb43698ac09640c71a90f87b84e50c3d332c9f7e40c2345d2f57ce9bc63'

          req = urllib.request.Request(page, headers={'User-Agent': 'Mozilla/5.0'})
          raw = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'ignore')
          normalized = htmlmod.unescape(raw).replace('\\u0026', '&').replace('\\/', '/')
          urls = re.findall(r'https://cdn\.pixabay\.com/[^\"\'<>\\s]+?\.mp3(?:\?[^\"\'<>\\s]*)?', normalized)
          urls = list(dict.fromkeys(urls))
          preferred = [u for u in urls if '8312' in u or 'rain-on-roof-or-window' in u.lower()]
          candidates = preferred or urls
          if not candidates:
              raise SystemExit('No Pixabay MP3 URL found on source page')

          data = None
          matched_url = None
          for url in candidates:
              try:
                  req2 = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Referer': 'https://pixabay.com/'})
                  candidate = urllib.request.urlopen(req2, timeout=60).read()
              except Exception as exc:
                  print(f'Skip download error: {url} -> {exc}')
                  continue
              digest = hashlib.sha256(candidate).hexdigest()
              print(f'Candidate {len(candidate)} bytes sha256={digest} url={url}')
              if digest == expected_mp3_sha:
                  data = candidate
                  matched_url = url
                  break

          if data is None:
              raise SystemExit('Pixabay source was found, but no downloaded MP3 matched the exact Library recording SHA-256')

          payload = base64.b64encode(data).decode('ascii')
          b64_digest = hashlib.sha256(payload.encode('ascii')).hexdigest()
          if b64_digest != expected_b64_sha:
              raise SystemExit(f'Unexpected Base64 SHA-256: {b64_digest}')

          pathlib.Path('assets/audio/rain-loop.mp3.b64').write_text(payload, encoding='ascii')

          story_path = pathlib.Path('src/audio/story-sfx.js')
          story = story_path.read_text(encoding='utf-8')
          old = "../../assets/audio/rain-loop.mp3.b64?v=4"
          new = "../../assets/audio/rain-loop.mp3.b64?v=5"
          if old not in story:
              raise SystemExit('Expected rain cache version v=4 not found; refusing to alter story code')
          if "source.loop = name === 'rain' ? false : Boolean(loop);" not in story:
              raise SystemExit('Rain one-shot guard is missing; refusing source-only restore')
          story_path.write_text(story.replace(old, new, 1), encoding='utf-8')

          print(f'Exact target matched: {matched_url}')
          print(f'MP3 bytes: {len(data)}')
          print(f'MP3 sha256: {expected_mp3_sha}')
          print(f'Base64 sha256: {expected_b64_sha}')

      - name: Restore temporary trigger files and commit only target changes
        shell: bash
        run: |
          set -euo pipefail
          BASELINE=28b44ebc1e86f27315602fa1d037c27122629209
          git show "$BASELINE:.github/workflows/fetch-rain.yml" > .github/workflows/fetch-rain.yml
          git show "$BASELINE:.fetch-rain-trigger" > .fetch-rain-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/rain-loop.mp3.b64 src/audio/story-sfx.js .github/workflows/fetch-rain.yml .fetch-rain-trigger
          git diff --cached --stat
          git diff --cached -- src/audio/story-sfx.js
          git commit -m "Restore full 41.82-second rain source"
          git push
