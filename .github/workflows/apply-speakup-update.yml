name: Assemble SpeakUP update

on:
  push:
    branches:
      - speakup-update-2026-07-26
    paths:
      - .speakup-update/ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4

      - name: Verify and assemble corrected build
        shell: bash
        run: |
          set -euo pipefail
          cd .speakup-update
          sha256sum -c SHA256SUMS
          cat part-* > /tmp/index.html.xz.b64
          base64 --decode /tmp/index.html.xz.b64 > /tmp/index.html.xz
          xz --test /tmp/index.html.xz
          xz --decompress --stdout /tmp/index.html.xz > ../index.html
          cd ..
          test "$(wc -c < index.html)" -eq 815545
          grep -q '<title>SpeakUP</title>' index.html
          rm -rf .speakup-update
          rm -f .github/workflows/apply-speakup-update.yml

      - name: Commit verified SpeakUP build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update SpeakUP to latest corrected build"
          git push
