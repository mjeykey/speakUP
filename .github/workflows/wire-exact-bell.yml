name: Wire exact Tsar bell into Story Mode

on:
  push:
    branches: [main]
    paths:
      - '.wire-exact-bell-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-bell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point Story SFX directly at verified MP3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          sfx_path = Path('src/audio/story-sfx.js')
          sfx = sfx_path.read_text(encoding='utf-8')

          sfx, n = re.subn(
              r"let bellMp3Url = '';\nlet bellMp3UrlPromise = null;\n",
              "const BELL_MP3_URL = new URL('../../assets/audio/soundreality-tsar-bell-sound-simulation-292699.mp3', import.meta.url).href;\nlet bellMp3Url = BELL_MP3_URL;\n",
              sfx,
              count=1,
          )
          if n != 1:
              raise SystemExit('Could not replace bell URL state')

          sfx, n = re.subn(
              r"// Exact uploaded 50\.04 s Tsar church-bell recording, stored as 17 Base64 parts in this repository\.\nconst BELL_MP3_PART_URLS = Array\.from\(\{ length: 17 \}, \(_, index\) =>\n  `https://raw\.githubusercontent\.com/mjeykey/speakUP/main/\.bell-tsar/p\$\{String\(index\)\.padStart\(2, '0'\)\}\.b64`\n\);\n",
              "// Exact verified 50.04 s user-uploaded Tsar church-bell recording.\n",
              sfx,
              count=1,
          )
          if n != 1:
              raise SystemExit('Could not remove old 17-part bell definition')

          replacement = '''async function getBellMp3Url() {
  const audio = ensureBellAudio();
  bellMp3Url = BELL_MP3_URL;
  if (audio.src !== BELL_MP3_URL) {
    audio.src = BELL_MP3_URL;
    audio.load();
  }
  return BELL_MP3_URL;
}

async function sourceArrayBuffer'''
          sfx, n = re.subn(
              r"async function getBellMp3Url\(\) \{.*?\n\}\n\nasync function sourceArrayBuffer",
              replacement,
              sfx,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('Could not replace bell rebuild function')

          sfx = sfx.replace(
              '// When already rebuilt, play() stays inside the user\'s Story navigation gesture.',
              '// Direct verified MP3 keeps play() inside the user\'s Story navigation gesture.'
          )
          sfx = sfx.replace(
              '// Build the exact uploaded church-bell recording immediately so page 5 can\n  // start it synchronously from the user\'s navigation gesture.',
              '// Preload the exact verified church-bell MP3 so page 5 can\n  // start it synchronously from the user\'s navigation gesture.'
          )
          sfx_path.write_text(sfx, encoding='utf-8')

          def bump_file(path_str, pattern):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              m = re.search(pattern, text)
              if not m:
                  raise SystemExit(f'Could not find cache version in {path_str}')
              old = int(m.group(1))
              text = text[:m.start(1)] + str(old + 1) + text[m.end(1):]
              path.write_text(text, encoding='utf-8')
              print(f'{path_str}: {old} -> {old + 1}')

          bump_file('src/modules/story.js', r"story-sfx\.js\?v=(\d+)")
          bump_file('src/modules/story-loader.js', r"story\.js\?v=(\d+)")
          bump_file('src/app/main.js', r"story-loader\.js\?v=(\d+)")
          bump_file('index.html', r"src/app/main\.js\?v=(\d+)")
          PY

          # Old temporary bell transports are no longer part of playback.
          rm -rf .bell-upload .bell-tsar

      - name: Commit direct verified bell wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m 'Use exact uploaded Tsar bell directly on Story pages 5-8'
          git push
