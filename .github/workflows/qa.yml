name: SpeakUP QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test page 189 audio
        run: npx playwright test tests/story-audio-189.spec.js --project=desktop-chromium
      - name: Run static QA
        run: npm test
      - name: Run browser QA
        run: npm run test:browser
