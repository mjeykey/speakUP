name: Inject direct word audio

on:
  push:
    branches: [main]
    paths:
      - .speakup-word-audio-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script directly into app.html
        shell: python
        run: |
          from pathlib import Path
          path = Path('app.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="word-audio.js?v=4"></script>'
          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit('app.html has no closing body tag')
              text = text.replace('</body>', f'  {tag}\n</body>', 1)
              path.write_text(text, encoding='utf-8')
      - name: Commit app.html change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          if git diff --cached --quiet; then
            echo "Already injected"
          else
            git commit -m "Enable direct word pronunciation in story mode"
            git push
          fi
