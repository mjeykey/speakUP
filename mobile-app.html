<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SpeakUP</title>
</head>
<body>
<script>
  window.Translator = {
    async availability() { return 'available'; },
    async create() {
      return {
        async translate(text) { return String(text ?? ''); },
        destroy() {}
      };
    }
  };

  function removeLegacyStoryNarration(source) {
    let html = String(source || '');
    html = html.replace(
      /\(0, react_10\.useState\)\(!Boolean\(settings\.audioOn && settings\.sentenceAudioOn\)\)/g,
      '(0, react_10.useState)(true)'
    );
    html = html.replace(
      /setInitialNarrationDone\(!Boolean\(settings\.audioOn && settings\.sentenceAudioOn\)\);/g,
      'setInitialNarrationDone(true);'
    );
    html = html.replace(
      /resetAllPlayback\(\);\s*setIsPageFinishing\(true\);\s*setLearningReplayCharIndex\(0\);\s*setPageReadyToContinue\(false\);/g,
      'resetAllPlayback();\n            setIsPageFinishing(false);\n            setLearningReplayCharIndex(currentPage.text.length);\n            setPageReadyToContinue(true);\n            return;'
    );
    return html;
  }

  function improveMemoryMode(source) {
    let html = String(source || '');
    html = html.replace(
      "{ id: 'friend_f', en: 'friend', de: 'Freundin', pt: 'amiga'",
      "{ id: 'friend_f', en: 'friend female', de: 'Freundin', pt: 'amiga'"
    );
    html = html.replace(
      "{ id: 'friend_m', en: 'friend', de: 'Freund', pt: 'amigo'",
      "{ id: 'friend_m', en: 'friend male', de: 'Freund', pt: 'amigo'"
    );
    html = html.replace(
      /(\/\/ Chrome and some Android browsers need a short beat after cancel\(\)\.[\s\S]*?startTimer\s*=\s*window\.setTimeout\(\(\)\s*=>\s*\{[\s\S]*?speakQueueItem\(queue,\s*0,\s*lang,\s*language,\s*token,\s*options\);\s*\},\s*)\d+(\s*\);)/,
      '$120$2'
    );
    return html;
  }

  function improveFillGapMode(source) {
    let html = String(source || '');

    const oldChoose = `        function choose(option) {
            if (option !== sentence.gap)
                return;
            (0, speech_js_3.speak)(option, settings.language, settings.audioOn && settings.sentenceAudioOn, (0, speech_js_3.getGlobalVoiceOptions)(settings.narratorVoice, settings.narratorTone, { rate: 0.72, pitch: 1.05 }));
            setSolved(true);
        }`;

    const newChoose = `        function choose(option) {
            if (option !== sentence.gap)
                return;
            const audioEnabled = settings.audioOn && settings.sentenceAudioOn;
            (0, speech_js_3.speak)(option, settings.language, audioEnabled, (0, speech_js_3.getGlobalVoiceOptions)(settings.narratorVoice, settings.narratorTone, { rate: 0.72, pitch: 1.05 }));
            window.setTimeout(() => {
                (0, speech_js_3.speak)(sentence.sentence, settings.language, audioEnabled, {
                    chunk: false,
                    ...(0, speech_js_3.getGlobalVoiceOptions)(settings.narratorVoice, settings.narratorTone, { rate: 0.76, pitch: 1.02 })
                });
            }, audioEnabled ? 650 : 0);
            setSolved(true);
        }`;

    html = html.replace(oldChoose, newChoose);

    const oldDissolve = `react_6.default.createElement(SentenceDissolve_jsx_1.default, { text: sentence.sentence, effect: settings.effect, customSound: settings.customSound, onComplete: () => onSolved(sentence) })`;
    const newDissolve = `react_6.default.createElement(SentenceDissolve_jsx_1.default, { text: sentence.sentence, effect: settings.effect, customSound: settings.customSound, startDelay: settings.audioOn && settings.sentenceAudioOn ? Math.max(3200, sentence.sentence.split(/\\s+/).length * 620) : 350, onComplete: () => onSolved(sentence) })`;
    html = html.replace(oldDissolve, newDissolve);

    return html;
  }

  (async () => {
    try {
      const response = await fetch('app.html?v=fill-gap-native-repeat-2', { cache: 'no-store' });
      if (!response.ok) throw new Error(`Could not load SpeakUP (${response.status})`);
      let html = await response.text();
      html = removeLegacyStoryNarration(html);
      html = improveMemoryMode(html);
      html = improveFillGapMode(html);
      const helpers = '<script src="voice-router.js?v=12"><\/script><script src="story-bilingual.js?v=5"><\/script><script src="story-language-quality.js?v=2"><\/script><script src="story-flow-controller.js?v=9"><\/script>';
      html = html.includes('</body>') ? html.replace('</body>', `${helpers}</body>`) : `${html}${helpers}`;
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      document.body.innerHTML = `<p style="color:white;background:#020205;padding:24px;font-family:Arial">SpeakUP could not start.<br>${String(error.message || error)}</p>`;
    }
  })();
</script>
</body>
</html>
