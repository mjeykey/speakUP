<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SpeakUP</title>
</head>
<body>
<script>
  window.Translator = {
    async availability() { return 'available'; },
    async create() {
      return {
        async translate(text) { return String(text ?? ''); },
        destroy() {}
      };
    }
  };

  function removeLegacyStoryNarration(source) {
    let html = String(source || '');
    html = html.replace(
      /\(0, react_10\.useState\)\(!Boolean\(settings\.audioOn && settings\.sentenceAudioOn\)\)/g,
      '(0, react_10.useState)(true)'
    );
    html = html.replace(
      /setInitialNarrationDone\(!Boolean\(settings\.audioOn && settings\.sentenceAudioOn\)\);/g,
      'setInitialNarrationDone(true);'
    );
    html = html.replace(
      /resetAllPlayback\(\);\s*setIsPageFinishing\(true\);\s*setLearningReplayCharIndex\(0\);\s*setPageReadyToContinue\(false\);/g,
      'resetAllPlayback();\n            setIsPageFinishing(false);\n            setLearningReplayCharIndex(currentPage.text.length);\n            setPageReadyToContinue(true);\n            return;'
    );
    return html;
  }

  function improveMemoryMode(source) {
    let html = String(source || '');

    // Exact entries used by the current vocabulary and Memory data source.
    html = html.replace(
      "{ id: 'friend_f', en: 'friend', de: 'Freundin', pt: 'amiga'",
      "{ id: 'friend_f', en: 'female friend', de: 'Freundin', pt: 'amiga'"
    );
    html = html.replace(
      "{ id: 'friend_m', en: 'friend', de: 'Freund', pt: 'amigo'",
      "{ id: 'friend_m', en: 'male friend', de: 'Freund', pt: 'amigo'"
    );

    // Shorten the real speech queue delay after cancel() without adding a second audio path.
    html = html.replace(
      /(\/\/ Chrome and some Android browsers need a short beat after cancel\(\)\.[\s\S]*?startTimer\s*=\s*window\.setTimeout\(\(\)\s*=>\s*\{[\s\S]*?speakQueueItem\(queue,\s*0,\s*lang,\s*language,\s*token,\s*options\);\s*\},\s*)\d+(\s*\);)/,
      '$120$2'
    );

    return html;
  }

  (async () => {
    try {
      const response = await fetch('app.html?v=memory-exact-fix-2', { cache: 'no-store' });
      if (!response.ok) throw new Error(`Could not load SpeakUP (${response.status})`);
      let html = improveMemoryMode(removeLegacyStoryNarration(await response.text()));
      const helpers = '<script src="voice-router.js?v=11"><\/script><script src="story-bilingual.js?v=5"><\/script><script src="story-language-quality.js?v=2"><\/script><script src="story-flow-controller.js?v=9"><\/script>';
      html = html.includes('</body>') ? html.replace('</body>', `${helpers}</body>`) : `${html}${helpers}`;
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      document.body.innerHTML = `<p style="color:white;background:#020205;padding:24px;font-family:Arial">SpeakUP could not start.<br>${String(error.message || error)}</p>`;
    }
  })();
</script>
</body>
</html>
