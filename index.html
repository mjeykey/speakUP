<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SpeakUP</title>
  <style>
    html,body,#speakup-app{width:100%;height:100%;margin:0;border:0;background:#020205;overflow:hidden}
    #speakup-app{display:block}
  </style>
</head>
<body>
  <iframe id="speakup-app" src="app.html?v=audio-repair-7" title="SpeakUP" allow="microphone; autoplay"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('speakup-app');
      frame.addEventListener('load', () => {
        const doc = frame.contentDocument;
        if (!doc || doc.getElementById('speakup-unified-audio-v7')) return;
        const script = doc.createElement('script');
        script.id = 'speakup-unified-audio-v7';
        script.src = 'word-audio.js?v=7';
        doc.body.appendChild(script);
      });
    })();
  </script>
</body>
</html>
