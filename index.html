<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SpeakUP</title>
  <style>
    html,body,#speakup-app{width:100%;height:100%;margin:0;border:0;background:#020205;overflow:hidden}
    #speakup-app{display:block}
  </style>
</head>
<body>
  <iframe id="speakup-app" src="app.html?v=word-audio-3" title="SpeakUP" allow="microphone; autoplay"></iframe>
  <script>
  (() => {
    const frame = document.getElementById('speakup-app');
    const languageMap = {
      english:'en-US', englisch:'en-US',
      portuguese:'pt-PT', portugiesisch:'pt-PT', português:'pt-PT',
      german:'de-DE', deutsch:'de-DE',
      spanish:'es-ES', spanisch:'es-ES', español:'es-ES',
      french:'fr-FR', französisch:'fr-FR', français:'fr-FR',
      italian:'it-IT', italienisch:'it-IT', italiano:'it-IT',
      croatian:'hr-HR', kroatisch:'hr-HR', hrvatski:'hr-HR'
    };

    function detectLearningLanguage(doc) {
      for (const select of doc.querySelectorAll('select')) {
        const selected = select.options && select.options[select.selectedIndex];
        const text = `${select.value || ''} ${selected ? selected.textContent : ''}`.toLowerCase();
        for (const [name, code] of Object.entries(languageMap)) {
          if (text.includes(name) || text.includes(code.toLowerCase().split('-')[0])) return code;
        }
      }
      return doc.documentElement.lang || 'en-US';
    }

    function speak(doc, word) {
      const clean = (word || '').trim();
      if (!clean || !window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(clean);
      utterance.lang = detectLearningLanguage(doc);
      utterance.rate = 0.72;
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    }

    function wrapTextNode(doc, node) {
      if (!node || node.nodeType !== Node.TEXT_NODE || !node.nodeValue || !node.nodeValue.trim()) return;
      const parent = node.parentElement;
      if (!parent || parent.closest('button,.story-gap,.story-choice,.story-option-block,.story-active-card') || parent.classList.contains('speakup-audio-word')) return;
      const parts = node.nodeValue.split(/([\p{L}\p{M}]+(?:['’\-][\p{L}\p{M}]+)*)/gu);
      if (parts.length < 2) return;
      const frag = doc.createDocumentFragment();
      for (const part of parts) {
        if (/^[\p{L}\p{M}]+(?:['’\-][\p{L}\p{M}]+)*$/u.test(part)) {
          const span = doc.createElement('span');
          span.className = 'speakup-audio-word';
          span.textContent = part;
          span.dataset.word = part;
          frag.appendChild(span);
        } else {
          frag.appendChild(doc.createTextNode(part));
        }
      }
      node.replaceWith(frag);
    }

    function enhanceStory(doc) {
      const roots = doc.querySelectorAll('.story-text');
      roots.forEach(root => {
        const walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(node => wrapTextNode(doc, node));
      });
    }

    function install() {
      const doc = frame.contentDocument;
      if (!doc || doc.__speakupWordAudioInstalled) return;
      doc.__speakupWordAudioInstalled = true;

      const style = doc.createElement('style');
      style.textContent = `
        .story-text .speakup-audio-word{cursor:pointer;touch-action:manipulation;border-radius:.18em;padding:0 .015em}
        .story-text .speakup-audio-word:active{background:rgba(101,232,255,.22);color:#dffaff}
      `;
      doc.head.appendChild(style);

      const activate = event => {
        const target = event.target && event.target.closest ? event.target.closest('.speakup-audio-word') : null;
        if (!target || !target.closest('.story-text')) return;
        event.stopPropagation();
        speak(doc, target.dataset.word || target.textContent);
      };

      doc.addEventListener('click', activate, true);
      doc.addEventListener('pointerup', activate, true);

      enhanceStory(doc);
      const observer = new MutationObserver(() => enhanceStory(doc));
      observer.observe(doc.body, {childList:true, subtree:true});
    }

    frame.addEventListener('load', install);
  })();
  </script>
</body>
</html>
