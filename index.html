<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>SpeakUP</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #020205;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
    }
    main { width: min(680px, 88vw); text-align: center; }
    h1 { margin: 0; font-size: clamp(54px, 10vw, 104px); font-weight: 400; font-style: italic; }
    h1 span { background: linear-gradient(90deg, #ff5fd7, #65e8ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #9daac7; font: 16px/1.6 Arial, sans-serif; }
    .error { color: #ffb6c6; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Speak<span>UP</span></h1>
    <p id="status">Loading your journey…</p>
  </main>
  <script type="module">
    const status = document.getElementById('status');
    const SOURCE_SIZE = 815545;
    const SOURCE_SHA256 = '2424a7620bc04b56775f43e52347401fefd0ef06d78f60c86620eb68f688f97b';
    const FINAL_SIZE = 815696;
    const FINAL_SHA256 = 'd0f73401b835b0de2bbda891505dc4abfde90b73806424c8f3f6d1fc9ad36a28';
    const PART_HASHES = [
      '179d5e93c18484ad6e154108e24557bbaa4487f1fa13aa5619a36ed039bd563f',
      '1eebf5e6d7588151d4bca9852d3557b81f7075abfbb0869d38a87c834b1260e1',
      '5903ff4598d70f5337e14c35ab0fb3cd75b7e4eafed7f57ee0ede6154cfb1aa8',
      '2586f3449378410916c6ac1b6ab81070c9974091224ea7075015e8d730c4b717',
      'dc82cffb515499a04d55f91a81fb079bc3f48c9c69886d51000d3d1279d589e1',
      '0b760fec371bce0f0e5494f46cd62d39fca4249afc31effb248c96475f0ec6ca',
      '949bb0bdb9f37edda271c377084cecaa6d9b4bb71db7e42f32eb6a96a81dc331',
      'cfed6c8926ca4a33d5049d685d20346d2982a75882a0881e27385c029ba7e1a6',
      'fd27b3f0b3599cdac51b2cfb374e0f7f6379fd7b31583c2ceec804deae7248bd',
      'afee4b6d32338b5120a3dd529efe4b6f943c7c9b9dd4c7b4b5ff86043a6e88d3',
      'c57af9ea4b3e1c4d8cc13244685a2d200d2a010a406750fcfbd222d7dca10761',
      '5fab00a036ff0d44988c039cce50d6d155fc6e96ff10be6533222c3e420dc604',
      'ee7d21049a7ca69f202a9cdd11108770e0df2979a1e8732ff85b4e52df9f9630',
      '793206cafe543512ee53913dd744460dc56b4b9ccf5f889b0c835586838c681b',
      '25eadeae58e041b80ca6e2639d556a8228e150e944bc9ca55c6d3597f306016a',
      'f2eac89bcc0eb4821b0d222fa850ddd7868c807e91e0ad4e4e90608c0f2678c0'
    ];

    function bytesFromBase64(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
      return bytes;
    }

    async function sha256Hex(bytes) {
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
    }

    function replaceOnce(text, oldText, newText, label) {
      const first = text.indexOf(oldText);
      const second = first < 0 ? -1 : text.indexOf(oldText, first + oldText.length);
      if (first < 0 || second >= 0) throw new Error(`${label}: expected exactly one match`);
      return text.slice(0, first) + newText + text.slice(first + oldText.length);
    }

    function applyFillGapNativeAudioFix(source) {
      const fillStart = source.indexOf('function FillGapMode({ sentence, settings, onSolved, onMenu })');
      const fillEnd = source.indexOf('define("screens/MemoryMode"', fillStart);
      if (fillStart < 0 || fillEnd < 0) throw new Error('FillGap module was not found');
      let fill = source.slice(fillStart, fillEnd);

      fill = replaceOnce(
        fill,
        `            });\n        }, [sentence, settings.language, settings.audioOn, settings.sentenceAudioOn, settings.gapAudioStyle]);`,
        `            });\n            return () => (0, speech_js_3.stopSpeaking)();\n        }, [sentence, settings.language, settings.audioOn, settings.sentenceAudioOn, settings.gapAudioStyle]);`,
        'FillGap speech cleanup'
      );
      fill = replaceOnce(
        fill,
        'onComplete: () => onSolved(sentence)',
        'onComplete: () => { (0, speech_js_3.stopSpeaking)(); onSolved(sentence); }',
        'FillGap completion handoff'
      );
      source = source.slice(0, fillStart) + fill + source.slice(fillEnd);

      const translationStart = source.indexOf('function TranslationScreen({ item, nativeLanguage');
      const translationEnd = source.indexOf('define("components/EffectLayer"', translationStart);
      if (translationStart < 0 || translationEnd < 0) throw new Error('Mother-language module was not found');
      let translation = source.slice(translationStart, translationEnd);

      translation = replaceOnce(
        translation,
        'if (!audioOn || !text || !language) {',
        'if (!audioOn || !translationAudioOn || !text || !language) {',
        'Mother-language audio setting'
      );
      translation = replaceOnce(
        translation,
        `            audioOn,\n            clearLocalTimers,`,
        `            audioOn,\n            translationAudioOn,\n            clearLocalTimers,`,
        'Mother-language audio dependency'
      );
      source = source.slice(0, translationStart) + translation + source.slice(translationEnd);

      const mapping = 'item: translationItem || current, nativeLanguage: nativeLanguage, learningLanguage: language, audioOn: audioOn';
      if (source.split(mapping).length !== 2) throw new Error('Language routing is not exact');
      return source;
    }

    async function loadSpeakUp() {
      const { XzReadableStream } = await import('https://cdn.jsdelivr.net/npm/xz-decompress@0.2.3/+esm');
      status.textContent = 'Verifying SpeakUP…';

      const partTexts = await Promise.all(PART_HASHES.map(async (expectedHash, index) => {
        const name = `part-${String(index).padStart(3, '0')}`;
        const response = await fetch(`.speakup-update/${name}?v=${FINAL_SHA256.slice(0, 12)}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Could not load ${name}`);
        const text = await response.text();
        const actualHash = await sha256Hex(new TextEncoder().encode(text));
        if (actualHash !== expectedHash) throw new Error(`${name} failed its integrity check`);
        return text.trim();
      }));

      const compressed = bytesFromBase64(partTexts.join(''));
      const source = await new Response(new XzReadableStream(new Blob([compressed]).stream())).text();
      const sourceBytes = new TextEncoder().encode(source);
      if (sourceBytes.length !== SOURCE_SIZE || await sha256Hex(sourceBytes) !== SOURCE_SHA256) {
        throw new Error('The assembled SpeakUP source failed its integrity check');
      }

      const fixed = applyFillGapNativeAudioFix(source);
      const fixedBytes = new TextEncoder().encode(fixed);
      if (fixedBytes.length !== FINAL_SIZE || await sha256Hex(fixedBytes) !== FINAL_SHA256) {
        throw new Error('The corrected SpeakUP build failed its integrity check');
      }

      document.open();
      document.write(fixed);
      document.close();
    }

    loadSpeakUp().catch(error => {
      console.error(error);
      status.className = 'error';
      status.textContent = `SpeakUP could not start.\n${error.message}`;
    });
  </script>
</body>
</html>
