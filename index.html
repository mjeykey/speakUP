<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SpeakUP</title>
  <style>
    html,body,#speakup-app{width:100%;height:100%;margin:0;border:0;background:#020205;overflow:hidden}
    #speakup-app{display:block}
  </style>
</head>
<body>
  <iframe id="speakup-app" src="app.html?v=story-language-text-1" title="SpeakUP" allow="microphone; autoplay"></iframe>
  <script>
    const frame = document.getElementById('speakup-app');

    frame.addEventListener('load', () => {
      try {
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        if (!win || !doc) return;

        if (!('Translator' in win)) {
          const normalizeLanguage = value => String(value || 'en').toLowerCase().split('-')[0];

          async function translateWithGoogle(text, sourceLanguage, targetLanguage) {
            const source = normalizeLanguage(sourceLanguage);
            const target = normalizeLanguage(targetLanguage);
            const input = String(text ?? '');
            if (!input || source === target) return input;

            const cacheKey = `speakup-mobile-translation-v1:${source}:${target}:${input}`;
            try {
              const cached = win.localStorage.getItem(cacheKey);
              if (cached) return cached;
            } catch (_) {}

            const url = new URL('https://translate.googleapis.com/translate_a/single');
            url.searchParams.set('client', 'gtx');
            url.searchParams.set('sl', source);
            url.searchParams.set('tl', target);
            url.searchParams.set('dt', 't');
            url.searchParams.set('q', input);

            const response = await fetch(url.toString(), { cache: 'no-store' });
            if (!response.ok) throw new Error(`Translation request failed (${response.status})`);
            const payload = await response.json();
            const translated = Array.isArray(payload?.[0])
              ? payload[0].map(part => Array.isArray(part) ? (part[0] || '') : '').join('')
              : '';
            if (!translated) throw new Error('The translation service returned no text');

            try {
              win.localStorage.setItem(cacheKey, translated);
            } catch (_) {}
            return translated;
          }

          win.Translator = {
            async availability({ sourceLanguage, targetLanguage } = {}) {
              return normalizeLanguage(sourceLanguage) === normalizeLanguage(targetLanguage)
                ? 'available'
                : 'downloadable';
            },
            async create({ sourceLanguage = 'en', targetLanguage = 'en', monitor } = {}) {
              if (typeof monitor === 'function') {
                monitor({ addEventListener() {} });
              }
              return {
                async translate(text) {
                  return translateWithGoogle(text, sourceLanguage, targetLanguage);
                },
                destroy() {}
              };
            }
          };
        }

        if (!doc.getElementById('speakup-voice-router')) {
          const script = doc.createElement('script');
          script.id = 'speakup-voice-router';
          script.src = 'voice-router.js?v=1';
          script.defer = true;
          (doc.head || doc.documentElement).appendChild(script);
        }
      } catch (error) {
        console.warn('SpeakUP mobile helpers could not be loaded:', error);
      }
    });
  </script>
</body>
</html>
