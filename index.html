<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SpeakUP</title>
  <style>
    html,body,#speakup-app{width:100%;height:100%;margin:0;border:0;background:#020205;overflow:hidden}
    #speakup-app{display:block}
  </style>
</head>
<body>
  <iframe id="speakup-app" src="mobile-app.html?v=remove-full-translation-1" title="SpeakUP" allow="microphone; autoplay"></iframe>
  <script>
    const frame = document.getElementById('speakup-app');

    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      if (!doc) return;

      const skipFullTranslation = () => {
        const text = String(doc.body?.innerText || '').toLowerCase();
        const isFullTranslation = text.includes('full translation') && text.includes('translation complete');
        if (!isFullTranslation) return;

        const buttons = [...doc.querySelectorAll('button')];
        const continueButton = buttons.find(button => String(button.textContent || '').trim().toLowerCase() === 'continue');
        if (!continueButton) return;

        const screen = continueButton.closest('main, .screen') || doc.body;
        screen.style.visibility = 'hidden';
        continueButton.click();
      };

      skipFullTranslation();
      new MutationObserver(skipFullTranslation).observe(doc.documentElement, {
        childList: true,
        subtree: true,
        characterData: true
      });
    });
  </script>
</body>
</html>
