<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SpeakUP</title>
  <style>
    html,body,#speakup-app{width:100%;height:100%;margin:0;border:0;background:#020205;overflow:hidden}
    #speakup-app{display:block}
  </style>
</head>
<body>
  <iframe id="speakup-app" src="app.html?v=story-mobile-1" title="SpeakUP" allow="microphone; autoplay"></iframe>
  <script>
    const frame = document.getElementById('speakup-app');
    frame.addEventListener('load', () => {
      const win = frame.contentWindow;
      if (!win || 'Translator' in win) return;

      // Mobile fallback: keep Story Mode usable when Chrome's desktop-only
      // on-device Translator API is unavailable. Text remains unchanged.
      win.Translator = {
        async availability() {
          return 'available';
        },
        async create() {
          return {
            async translate(text) {
              return String(text ?? '');
            },
            destroy() {}
          };
        }
      };
    });
  </script>
</body>
</html>
