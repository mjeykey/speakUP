<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SpeakUP</title>
  <style>
    html,body,#speakup-app{width:100%;height:100%;margin:0;border:0;background:#020205;overflow:hidden}
    #speakup-app{display:block}
  </style>
</head>
<body>
  <iframe id="speakup-app" src="app.html?v=multilingual-voices-1" title="SpeakUP" allow="microphone; autoplay"></iframe>
  <script>
    const frame = document.getElementById('speakup-app');

    frame.addEventListener('load', () => {
      try {
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        if (!win || !doc) return;

        if (!('Translator' in win)) {
          // Mobile fallback: Story Mode remains usable where Chrome's
          // desktop-only on-device Translator API is unavailable.
          win.Translator = {
            async availability() {
              return 'available';
            },
            async create() {
              return {
                async translate(text) {
                  return String(text ?? '');
                },
                destroy() {}
              };
            }
          };
        }

        if (!doc.getElementById('speakup-voice-router')) {
          const script = doc.createElement('script');
          script.id = 'speakup-voice-router';
          script.src = 'voice-router.js?v=1';
          script.defer = true;
          (doc.head || doc.documentElement).appendChild(script);
        }
      } catch (error) {
        console.warn('SpeakUP mobile helpers could not be loaded:', error);
      }
    });
  </script>
</body>
</html>
