<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SpeakUP</title>
  <style>
    html,body,#speakup-app{width:100%;height:100%;margin:0;border:0;background:#020205;overflow:hidden}
    #speakup-app{display:block}
  </style>
</head>
<body>
  <iframe id="speakup-app" src="app.html?v=word-audio-2" title="SpeakUP" allow="microphone; autoplay"></iframe>
  <script>
  (() => {
    const frame = document.getElementById('speakup-app');

    const languageMap = {
      english:'en-US', englisch:'en-US',
      portuguese:'pt-PT', portugiesisch:'pt-PT', português:'pt-PT',
      german:'de-DE', deutsch:'de-DE',
      spanish:'es-ES', spanisch:'es-ES', español:'es-ES',
      french:'fr-FR', französisch:'fr-FR', français:'fr-FR',
      italian:'it-IT', italienisch:'it-IT', italiano:'it-IT',
      croatian:'hr-HR', kroatisch:'hr-HR', hrvatski:'hr-HR'
    };

    function detectLearningLanguage(doc) {
      for (const select of doc.querySelectorAll('select')) {
        const selected = select.options && select.options[select.selectedIndex];
        const text = `${select.value || ''} ${selected ? selected.textContent : ''}`.toLowerCase();
        for (const [name, code] of Object.entries(languageMap)) {
          if (text.includes(name) || text.includes(code.toLowerCase().split('-')[0])) return code;
        }
      }
      return doc.documentElement.lang || 'en-US';
    }

    function wordAtPoint(doc, x, y) {
      let node, offset;
      if (doc.caretPositionFromPoint) {
        const pos = doc.caretPositionFromPoint(x, y);
        if (!pos) return '';
        node = pos.offsetNode;
        offset = pos.offset;
      } else if (doc.caretRangeFromPoint) {
        const range = doc.caretRangeFromPoint(x, y);
        if (!range) return '';
        node = range.startContainer;
        offset = range.startOffset;
      } else return '';

      if (!node || node.nodeType !== 3) return '';
      const text = node.textContent || '';
      if (!text.trim()) return '';
      const isWord = ch => /[\p{L}\p{M}'’\-]/u.test(ch || '');
      let start = Math.min(offset, text.length);
      let end = start;
      if (!isWord(text[start]) && start > 0 && isWord(text[start - 1])) start--;
      while (start > 0 && isWord(text[start - 1])) start--;
      while (end < text.length && isWord(text[end])) end++;
      return text.slice(start, end).trim();
    }

    function speak(doc, word) {
      if (!word) return;
      const win = doc.defaultView;
      if (!win || !win.speechSynthesis || !win.SpeechSynthesisUtterance) return;
      win.speechSynthesis.cancel();
      const utterance = new win.SpeechSynthesisUtterance(word);
      utterance.lang = detectLearningLanguage(doc);
      utterance.rate = 0.78;
      utterance.pitch = 1;
      win.speechSynthesis.speak(utterance);
    }

    function install() {
      const doc = frame.contentDocument;
      if (!doc || doc.__speakupWordAudioInstalled) return;
      doc.__speakupWordAudioInstalled = true;

      const style = doc.createElement('style');
      style.textContent = '.story-text{cursor:pointer;touch-action:manipulation}.story-text [class*="story-"]{cursor:pointer}.story-text:active{opacity:.9}';
      doc.head.appendChild(style);

      const handle = event => {
        const ElementCtor = doc.defaultView.Element;
        const target = event.target instanceof ElementCtor ? event.target : event.target && event.target.parentElement;
        const story = target && target.closest('.story-text');
        if (!story) return;
        if (target.closest('button,.story-choice,.story-gap')) return;
        const word = wordAtPoint(doc, event.clientX, event.clientY);
        if (word) speak(doc, word);
      };

      doc.addEventListener('click', handle, true);
    }

    frame.addEventListener('load', install);
  })();
  </script>
</body>
</html>
