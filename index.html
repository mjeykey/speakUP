<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SpeakUP</title>
  <style>
    html,body,#speakup-app{width:100%;height:100%;margin:0;border:0;background:#020205;overflow:hidden}
    #speakup-app{display:block}
  </style>
</head>
<body>
  <iframe id="speakup-app" src="mobile-app.html?v=words-bilingual-audio-2" title="SpeakUP" allow="microphone; autoplay"></iframe>
  <script>
    const frame = document.getElementById('speakup-app');
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      if (!doc) return;

      if (!doc.getElementById('speakup-per-word-sync')) {
        const syncScript = doc.createElement('script');
        syncScript.id = 'speakup-per-word-sync';
        syncScript.src = 'per-word-sync.js?v=3';
        doc.body.appendChild(syncScript);
      }

      if (!doc.getElementById('speakup-words-audio-fix')) {
        const wordsScript = doc.createElement('script');
        wordsScript.id = 'speakup-words-audio-fix';
        wordsScript.src = 'words-audio-fix.js?v=3';
        doc.body.appendChild(wordsScript);
      }
    });
  </script>
</body>
</html>
