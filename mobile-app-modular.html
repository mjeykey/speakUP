<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="google" content="notranslate">
  <title>SpeakUP Modular Preview</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#020205;color:white}
    .startup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Arial,sans-serif;text-align:center}
  </style>
</head>
<body>
  <div id="startup" class="startup">SpeakUP wird geladen …</div>

  <script src="src/transforms/story-mode.js?v=6"></script>
  <script src="src/transforms/memory-mode.js?v=2"></script>
  <script src="src/transforms/words-mode.js?v=2"></script>
  <script src="src/transforms/fill-gap-mode.js?v=2"></script>
  <script src="src/transforms/index.js?v=2"></script>
  <script src="src/loader/app-loader.js?v=2"></script>
  <script>
    (() => {
      const startup = document.getElementById('startup');

      if (typeof window.SpeakUPLoader?.start !== 'function') {
        startup.textContent = 'SpeakUP konnte nicht starten: Der modulare Loader wurde nicht geladen.';
        return;
      }

      if (typeof window.SpeakUPTransforms?.applyAll !== 'function') {
        startup.textContent = 'SpeakUP konnte nicht starten: Die Transformationsmodule wurden nicht vollständig geladen.';
        return;
      }

      window.SpeakUPLoader.start({
        appUrl: 'app.html',
        cacheKey: 'modular-preview-6'
      });
    })();
  </script>
</body>
</html>
